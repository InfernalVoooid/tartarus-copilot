/* Layout: one ring board as the stage, the courtyard inside it as the dialogue, one analysis rail on the right,
   a floating run bubble on the left. Dark graphite, one silver "lantern" gradient, rarity colours only on beasts. */
:root {
  color-scheme: dark;
  --bg: #131519;
  --s1: #191c21;
  --s2: #1f2329;
  --s3: #272c33;
  --s4: #30363e;
  --line: #2a2f36;
  --tx: #e8ebf0;
  --tx2: #a0a7b2;
  --tx3: #6b727d;
  --ink: #121418;
  --glow: rgba(226, 233, 242, 0.14);
  --lantern: linear-gradient(135deg, #f6f8fb 0%, #cfd7e1 52%, #9eabbb 100%);
  --lantern-soft: radial-gradient(closest-side, rgba(232, 238, 246, 0.22), rgba(232, 238, 246, 0));
  --danger: #e07171;
  --r0: #b4bac4;
  --r1: #5f9cff;
  --r2: #efcd4f;
  --r3: #f0893d;
  --r4: #b17df7;
  --r5: conic-gradient(from 200deg, #ff6b6b, #ffb14a, #f4e35a, #6be38d, #59b8ff, #a77bff, #ff6b6b);
  --r5-line: linear-gradient(90deg, #ff6b6b, #ffb14a, #f4e35a, #6be38d, #59b8ff, #a77bff);
  --font: 'Geologica', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --fs-xs: 11px;
  --fs-s: 13px;
  --fs-m: 15px;
  --fs-l: 22px;
  --fs-xl: 40px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --snap: cubic-bezier(0.34, 1.56, 0.64, 1);
  --t-fast: 140ms;
  --t-mid: 260ms;
  --t-slow: 460ms;
  --cell: 108px;
  --gap: 8px;
  --radius: 14px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font: 400 var(--fs-m)/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--tx); outline-offset: 2px; border-radius: 8px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variation-settings: 'SHRP' 100; }

/* ---------- App frame ---------- */
.app { min-height: 100%; display: grid; grid-template-rows: auto 1fr; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px;
  height: 56px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  background: linear-gradient(var(--bg) 70%, rgba(19, 21, 25, 0));
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: 0.01em; }
.brand svg { width: 22px; height: 22px; }
.brand small { color: var(--tx3); font-weight: 400; font-size: var(--fs-s); }
.top-right { grid-column: 3; justify-self: end; display: flex; gap: 4px; }
.ghost {
  display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 10px;
  color: var(--tx2); font-size: var(--fs-s); transition: background var(--t-fast), color var(--t-fast);
}
.ghost:hover { background: var(--s2); color: var(--tx); }
.ghost.icon-only { width: 36px; padding: 0; justify-content: center; }

/* Day track */
.days { display: flex; align-items: center; gap: 12px; color: var(--tx2); font-size: var(--fs-s); }
.days b { color: var(--tx); font-weight: 600; }
.ticks { display: flex; gap: 3px; }
.ticks i { width: 6px; height: 14px; border-radius: 2px; background: var(--s3); transition: background var(--t-mid), transform var(--t-mid) var(--snap); }
.ticks i.past { background: var(--tx3); }
.ticks i.now { background: var(--lantern); transform: scaleY(1.25); }
.days[hidden] { display: none; }

/* ---------- Screens ---------- */
.screen { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px 48px; }
.screen[hidden] { display: none !important; }
.fade-in { animation: fadeUp var(--t-slow) var(--ease) both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeOut { to { opacity: 0; transform: translateY(-8px); } }

/* ---------- Setup ---------- */
.setup { max-width: 820px; margin: 0 auto; display: grid; gap: 40px; padding-top: 24px; }
.hero h1 { margin: 0 0 8px; font-size: var(--fs-xl); line-height: 1.05; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.hero p { margin: 0; color: var(--tx2); max-width: 56ch; }
.resume {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 16px 18px; border-radius: 16px; background: var(--s1);
}
.resume .txt { flex: 1 1 240px; min-width: 0; }
.resume .txt b { display: block; font-weight: 500; }
.resume .txt span { color: var(--tx2); font-size: var(--fs-s); }
.sec { display: grid; gap: 14px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; }
.sec-h h2 { margin: 0; font-size: var(--fs-m); font-weight: 600; white-space: nowrap; }
.sec-h span { color: var(--tx3); font-size: var(--fs-s); }
.goals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.goal.wide { grid-column: 1 / -1; padding: 12px 16px; }
.goal.wide .g-top p { margin: 0 0 0 6px; }
.goal {
  position: relative; text-align: left; display: grid; gap: 8px; align-content: start;
  padding: 16px; border-radius: 16px; background: var(--s1);
  transition: background var(--t-fast), transform var(--t-fast) var(--ease), box-shadow var(--t-mid);
}
.goal:hover { background: var(--s2); }
.goal:active { transform: scale(0.985); }
.goal .g-top { display: flex; align-items: center; gap: 10px; }
.goal .g-ico { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--s3); color: var(--tx2); transition: background var(--t-mid), color var(--t-mid); }
.goal b { font-weight: 600; }
.goal p { margin: 0; color: var(--tx2); font-size: var(--fs-s); line-height: 1.4; }
.goal .g-stats { display: flex; gap: 14px; color: var(--tx3); font-size: var(--fs-xs); }
.goal .g-stats em { font-style: normal; color: var(--tx2); }
.goal .g-stats { flex-wrap: wrap; align-items: center; }
.goal .g-stats .dot { width: 7px; height: 7px; display: inline-block; margin-right: 4px; vertical-align: 1px; }
.goal.on { background: var(--s2); box-shadow: inset 0 0 0 1px rgba(232, 236, 242, 0.55); }
.goal.on .g-ico { background: var(--lantern); color: var(--ink); }
.goal .rec { position: absolute; top: 14px; right: 14px; font-size: var(--fs-xs); color: var(--tx2); }
.colors { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 999px;
  background: var(--s1); color: var(--tx2); font-size: var(--fs-s); transition: background var(--t-fast), color var(--t-fast), box-shadow var(--t-fast);
}
.chip:hover { background: var(--s2); color: var(--tx); }
.chip.on { background: var(--s3); color: var(--tx); box-shadow: inset 0 0 0 1px rgba(232, 236, 242, 0.5); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.bonus-toggle { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 18px; border-radius: 16px; background: var(--s1); text-align: left; }
.bonus-toggle:hover { background: var(--s2); }
.bonus-toggle .sum { flex: 1; color: var(--tx2); font-size: var(--fs-s); }
.bonus-toggle .mult { font-weight: 600; }
.bonus-toggle .chev { transition: transform var(--t-mid) var(--ease); color: var(--tx3); }
.bonus-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
.bonus-body { display: grid; gap: 18px; padding: 4px 2px 0; }
.pets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.pet { display: grid; gap: 10px; padding: 14px; border-radius: 16px; background: var(--s1); align-content: start; }
.pet .p-top { display: flex; align-items: center; gap: 10px; }
.pet .p-top b { font-weight: 500; font-size: var(--fs-s); }
.pet .p-top small { display: block; color: var(--tx3); font-size: var(--fs-xs); }
.pet .p-eff { color: var(--tx2); font-size: var(--fs-xs); line-height: 1.45; min-height: 32px; }
.pips { display: flex; gap: 4px; }
.pips button { flex: 1; height: 26px; border-radius: 7px; background: var(--s3); color: var(--tx3); font-size: var(--fs-xs); transition: background var(--t-fast), color var(--t-fast); }
.pips button:hover { background: var(--s4); color: var(--tx); }
.pips button.on { background: var(--tx2); color: var(--ink); }
.pips button.cur { background: var(--lantern); color: var(--ink); font-weight: 600; }
.switch { display: inline-flex; align-items: center; gap: 10px; font-size: var(--fs-s); color: var(--tx2); }
.switch i { width: 34px; height: 20px; border-radius: 999px; background: var(--s3); position: relative; transition: background var(--t-mid); }
.switch i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--tx3); transition: transform var(--t-mid) var(--snap), background var(--t-mid); }
.switch.on i { background: var(--tx2); }
.switch.on i::after { transform: translateX(14px); background: var(--ink); }
.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 4px; border-radius: 14px; background: var(--s1); }
.seg button { padding: 10px 8px; border-radius: 10px; text-align: left; display: grid; gap: 2px; transition: background var(--t-fast); }
.seg button:hover { background: var(--s2); }
.seg button b { font-weight: 500; font-size: var(--fs-s); }
.seg button span { color: var(--tx3); font-size: var(--fs-xs); }
.seg button.on { background: var(--s3); box-shadow: inset 0 0 0 1px rgba(232, 236, 242, 0.45); }
.cta-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  height: 44px; padding: 0 20px; border-radius: 12px; font-weight: 500; overflow: hidden;
  background: var(--s3); color: var(--tx); transition: background var(--t-fast), transform var(--t-fast) var(--ease), opacity var(--t-fast);
}
.btn:hover { background: var(--s4); }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--lantern); color: var(--ink); }
.btn.primary::after {
  content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.55) 50%, transparent 70%);
  transform: translateX(-120%); transition: transform 700ms var(--ease);
}
.btn.primary:hover::after { transform: translateX(120%); }
.btn.small { height: 34px; padding: 0 14px; font-size: var(--fs-s); border-radius: 10px; }
.btn.quiet { background: transparent; color: var(--tx2); }
.btn.quiet:hover { background: var(--s2); color: var(--tx); }
.linkish { color: var(--tx2); font-size: var(--fs-s); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--tx3); }
.linkish:hover { color: var(--tx); }

/* ---------- Play ---------- */
.play { display: grid; grid-template-columns: auto minmax(300px, 360px); justify-content: center; align-items: start; gap: 32px; padding-top: 12px; }
.stage { display: grid; gap: 14px; justify-items: center; min-width: 0; }
.board {
  position: relative;
  display: grid; grid-template-columns: repeat(6, var(--cell)); grid-template-rows: var(--cell) minmax(var(--cell), auto) minmax(var(--cell), auto) var(--cell); gap: var(--gap);
}
.cell {
  position: relative; border-radius: var(--radius); background: var(--s2);
  display: grid; place-items: center; align-content: center; gap: 4px;
  transition: opacity var(--t-mid) var(--ease), filter var(--t-mid) var(--ease), background var(--t-fast), transform var(--t-fast) var(--ease), box-shadow var(--t-mid);
  overflow: hidden; isolation: isolate;
}
.cell .n { position: absolute; top: 8px; left: 10px; font-size: var(--fs-xs); color: var(--tx3); }
.cell .beast svg { width: 40px; height: 40px; }
.cell .lbl { font-size: var(--fs-xs); line-height: 1; letter-spacing: 0.01em; }
.cell .lock svg { width: 22px; height: 22px; color: var(--tx3); opacity: 0.55; }
.cell.sealed { background: color-mix(in srgb, var(--s2) 70%, var(--bg)); }
.cell.office .lock svg { opacity: 0.8; }
.cell .flags { position: absolute; right: 8px; bottom: 7px; display: flex; gap: 2px; color: var(--tx2); }
.cell .flags svg { width: 14px; height: 14px; }
.cell .ev { position: absolute; top: 7px; right: 8px; width: 18px; height: 18px; border-radius: 50%; background: var(--tx); color: var(--ink); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
button.cell:hover:not(:disabled) { background: var(--s3); }
.cell.warden::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(circle at 50% 50%, rgba(232, 238, 246, 0.2), rgba(232, 238, 246, 0) 72%); z-index: -1; animation: breathe 3.2s ease-in-out infinite; }
.cell.warden { background: color-mix(in srgb, var(--s2) 80%, #3a4250); }
.cell .wtag { position: absolute; top: 6px; right: 7px; color: var(--tx); }
.cell .wtag svg { width: 16px; height: 16px; }
@keyframes breathe { 50% { opacity: 0.55; } }
.board.focus .cell:not(.hot):not(.pick):not(.rec):not(.keep):not(.alt) { opacity: 0.32; filter: saturate(0.25); }
.cell.hot { box-shadow: inset 0 0 0 1px rgba(232, 238, 246, 0.5); animation: hotPulse 1.8s ease-in-out infinite; }
@keyframes hotPulse { 50% { box-shadow: inset 0 0 0 1px rgba(232, 238, 246, 0.18); } }
.cell.pick { box-shadow: inset 0 0 0 2px var(--tx); animation: none; background: var(--s3); }
.cell.pick .mark { position: absolute; top: 7px; right: 8px; width: 18px; height: 18px; border-radius: 50%; background: var(--lantern); color: var(--ink); display: grid; place-items: center; }
.cell.pick .mark svg { width: 12px; height: 12px; stroke-width: 2.4; }
.cell.rec { box-shadow: inset 0 0 0 2px #e9eef5, 0 0 0 6px rgba(232, 238, 246, 0.07), 0 0 36px rgba(232, 238, 246, 0.16); animation: none; }
.cell.rec::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(120deg, transparent 35%, rgba(255, 255, 255, 0.12) 50%, transparent 65%); transform: translateX(-100%); animation: sheen 2.6s var(--ease) infinite; z-index: -1; }
@keyframes sheen { 60%, 100% { transform: translateX(100%); } }
.cell.alt { box-shadow: inset 0 0 0 1px rgba(232, 238, 246, 0.28); }
.cell.pop { animation: pop 320ms var(--snap); }
@keyframes pop { 0% { transform: scale(0.9); } 100% { transform: none; } }
.cell.shake { animation: shake 320ms; }
@keyframes shake { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.cell.flash::before { content: ''; position: absolute; inset: 0; background: rgba(255, 255, 255, 0.35); animation: flash 600ms var(--ease) forwards; z-index: 2; pointer-events: none; }
@keyframes flash { to { opacity: 0; } }
.path { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.path polyline { fill: none; stroke: rgba(232, 238, 246, 0.5); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 0.5 7; }
.path polyline.draw { animation: draw 700ms var(--ease) both; }
@keyframes draw { from { stroke-dashoffset: 400; opacity: 0; } to { stroke-dashoffset: 0; opacity: 1; } }

/* Courtyard: the dialogue inside the ring */
.yard {
  grid-column: 2 / 6; grid-row: 2 / 4; position: relative;
  display: grid; align-content: center; justify-items: center; gap: 10px; text-align: center; padding: 6px 10px;
  min-width: 0;
}
.yard .head { display: grid; gap: 4px; justify-items: center; }
.yard h3 { margin: 0; font-size: var(--fs-l); line-height: 1.2; font-weight: 600; text-wrap: balance; }
.yard .sub { color: var(--tx2); font-size: var(--fs-s); max-width: 46ch; text-wrap: balance; }
.yard .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
.ycontent { display: grid; gap: 10px; justify-items: center; width: 100%; }
.swap-in { animation: fadeUp var(--t-mid) var(--ease) both; }
.qhelp { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; color: var(--tx3); vertical-align: -3px; }
.qhelp:hover { color: var(--tx); }
.qhelp svg { width: 16px; height: 16px; }

/* Beast × rarity picker */
.dock { width: 100%; display: grid; justify-items: center; }
.dock:empty { display: none; }
.core { display: none; grid-column: 2 / 6; grid-row: 2 / 4; place-items: center; align-content: center; gap: 2px; text-align: center; color: var(--tx3); font-size: var(--fs-xs); }
.core b { color: var(--tx); font-size: 26px; font-weight: 600; line-height: 1; }
.picker { display: grid; grid-template-columns: auto repeat(4, 42px); gap: 5px; align-items: center; }
.picker .rl { font-size: var(--fs-xs); text-align: right; padding-right: 6px; color: var(--tx2); white-space: nowrap; }
.picker .rl::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: var(--c); vertical-align: 1px; }
.picker button { height: 34px; border-radius: 9px; background: var(--s2); color: var(--c); display: grid; place-items: center; transition: background var(--t-fast), transform var(--t-fast) var(--ease); }
.picker button svg { width: 22px; height: 22px; }
.picker button:hover { background: var(--s4); transform: translateY(-1px); }
.picker button:active { transform: scale(0.92); }
.picker .ch { font-size: var(--fs-xs); color: var(--tx3); text-align: center; }
.picker .rb { grid-column: 2 / 6; height: 30px; border-radius: 9px; background: var(--s2); font-size: var(--fs-s); position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; }
.picker .rb::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--r5); }
.picker .rb:hover { background: var(--s4); }
.optlist { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.opt { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 11px; background: var(--s2); font-size: var(--fs-s); transition: background var(--t-fast), box-shadow var(--t-fast); }
.opt:hover { background: var(--s3); }
.opt.best { background: var(--s3); box-shadow: inset 0 0 0 1px rgba(232, 238, 246, 0.6); }
.opt.sel { box-shadow: inset 0 0 0 2px var(--tx); }
.tools-grid { display: grid; grid-template-columns: repeat(7, 44px); gap: 6px; justify-content: center; }
.tools-grid button { height: 44px; border-radius: 11px; background: var(--s2); color: var(--tx2); display: grid; place-items: center; transition: background var(--t-fast), color var(--t-fast), box-shadow var(--t-fast); }
.tools-grid button:hover { background: var(--s3); color: var(--tx); }
.tools-grid button.sel { background: var(--s3); color: var(--tx); box-shadow: inset 0 0 0 2px var(--tx); }
.tools-grid button.best { box-shadow: inset 0 0 0 2px #e9eef5, 0 0 20px rgba(232, 238, 246, 0.18); color: var(--tx); }
.tools-grid button:disabled { opacity: 0.25; }

/* Under-board toolbar */
.bar { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }

/* ---------- Analysis rail ---------- */
.rail { position: sticky; top: 72px; display: grid; gap: 0; background: var(--s1); border-radius: 18px; overflow: hidden; }
.rail section { padding: 18px 20px; display: grid; gap: 12px; }
.rail section + section { border-top: 1px solid var(--line); }
.rail h4 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: var(--fs-s); font-weight: 500; color: var(--tx2); }
.rail h4 .grow { flex: 1; }
.rail .muted { color: var(--tx3); font-size: var(--fs-s); }
.rail.sweep::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(100deg, transparent 30%, rgba(232, 238, 246, 0.07) 50%, transparent 70%); animation: sweep 700ms var(--ease) forwards; }
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--tx3); }
.status .spin { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--tx3); border-top-color: transparent; animation: spin 800ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.rows { display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 54px; gap: 4px 10px; align-items: center; padding: 6px 8px; margin: 0 -8px; border-radius: 10px; transition: background var(--t-fast); }
.row:hover { background: var(--s2); }
.row .rname { display: flex; align-items: center; gap: 8px; font-size: var(--fs-s); color: var(--tx2); min-width: 0; }
.row .rname span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .rv { text-align: right; font-size: var(--fs-s); color: var(--tx3); }
.row .track { grid-column: 1 / -1; height: 4px; border-radius: 3px; background: var(--s3); overflow: hidden; }
.row .track i { display: block; height: 100%; border-radius: 3px; background: var(--tx3); transform-origin: left; transition: width var(--t-slow) var(--ease); }
.row.best .rname { color: var(--tx); }
.row.best .rv { color: var(--tx); }
.row.best .track i { background: var(--lantern); }
.cell.rowhl { box-shadow: inset 0 0 0 2px rgba(232, 238, 246, 0.8); opacity: 1 !important; filter: none !important; }
.row .badge { font-size: var(--fs-xs); color: var(--tx3); }
.gamble { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 12px 14px; border-radius: 12px; background: var(--s2); position: relative; overflow: hidden; }
.gamble::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--r5-line); background-size: 100% 100%; }
.gamble .gi { grid-row: span 2; color: var(--tx); align-self: start; padding-top: 1px; }
.gamble b { font-weight: 500; font-size: var(--fs-s); }
.gamble p { margin: 0; color: var(--tx2); font-size: var(--fs-xs); line-height: 1.5; }
.gamble .go { grid-column: 2; justify-self: start; margin-top: 4px; }
.odds { display: grid; gap: 10px; }
.odd { display: grid; gap: 6px; }
.odd .ot { display: flex; justify-content: space-between; gap: 10px; font-size: var(--fs-s); color: var(--tx2); }
.odd .ot b { color: var(--tx); font-weight: 500; }
.stack { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--s3); gap: 2px; }
.stack i { display: block; height: 100%; min-width: 2px; transition: flex-grow var(--t-slow) var(--ease); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: var(--fs-xs); color: var(--tx3); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend .dot { width: 7px; height: 7px; }
.big { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
.big div { display: grid; }
.big b { font-size: 28px; font-weight: 600; line-height: 1.1; }
.big span { color: var(--tx3); font-size: var(--fs-xs); }
.note { font-size: var(--fs-xs); color: var(--tx3); line-height: 1.5; }

/* ---------- Floating run bubble ---------- */
.bubble {
  position: fixed; z-index: 40; left: max(20px, env(safe-area-inset-left, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  width: 52px; height: 52px; border-radius: 26px; background: var(--s2); overflow: hidden;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  transition: width var(--t-slow) var(--ease), height var(--t-slow) var(--ease), border-radius var(--t-slow) var(--ease), background var(--t-fast);
  animation: float 6s ease-in-out infinite;
}
.bubble:not(.open):hover { background: var(--s3); }
@keyframes float { 50% { transform: translateY(-4px); } }
.bubble.open { width: 320px; height: var(--bh, 420px); border-radius: 20px; animation: none; }
.b-body .b-link { justify-self: start; padding: 0 10px; margin-left: -10px; }
.bubble .b-btn { position: absolute; inset: 0; width: 52px; height: 52px; display: grid; place-items: center; color: var(--tx); }
.bubble.open .b-btn { opacity: 0; pointer-events: none; }
.bubble .b-body { position: absolute; inset: 0 auto 0 0; width: 320px; padding: 18px; display: grid; align-content: start; gap: 16px; overflow-y: auto; opacity: 0; pointer-events: none; transition: opacity var(--t-mid) var(--ease); }
.bubble.open .b-body { opacity: 1; pointer-events: auto; transition-delay: 160ms; }

.tchips { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- Tooltip, toast, sheet ---------- */
.tip {
  position: fixed; z-index: 90; max-width: 280px; padding: 10px 12px; border-radius: 10px; background: #2b3038; color: var(--tx);
  font-size: var(--fs-s); line-height: 1.45; pointer-events: none; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
  opacity: 0; transform: translateY(4px); transition: opacity var(--t-fast), transform var(--t-fast) var(--ease);
}
.tip.show { opacity: 1; transform: none; }
.tip b { font-weight: 600; }
.toast {
  position: fixed; z-index: 80; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
  display: flex; align-items: center; gap: 10px; max-width: min(440px, calc(100% - 32px)); padding: 12px 16px; border-radius: 14px;
  background: #2b3038; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45); font-size: var(--fs-s); opacity: 0;
  transition: opacity var(--t-mid) var(--ease), transform var(--t-mid) var(--snap);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast .ti { color: var(--tx); }
.toast.upd { top: calc(16px + env(safe-area-inset-top, 0px)); bottom: auto; border: 0; color: var(--tx); font: inherit; font-size: var(--fs-s); cursor: pointer; }
.overlay { position: fixed; inset: 0; z-index: 70; background: rgba(8, 9, 11, 0.6); opacity: 0; transition: opacity var(--t-mid); }
.overlay.show { opacity: 1; }
.sheet {
  position: fixed; z-index: 75; top: 0; right: 0; bottom: 0; width: min(980px, 100%); background: var(--s1);
  transform: translateX(100%); transition: transform var(--t-slow) var(--ease); display: grid; grid-template-rows: auto 1fr;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.sheet.show { transform: none; }
.sheet-h { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.sheet-h b { flex: 1; font-weight: 600; }
.wiki { display: grid; grid-template-columns: 180px minmax(0, 1fr); min-height: 0; }
.wiki nav { padding: 16px 10px; display: grid; align-content: start; gap: 2px; border-right: 1px solid var(--line); overflow-y: auto; }
.wiki nav button { text-align: left; padding: 8px 12px; border-radius: 9px; color: var(--tx2); font-size: var(--fs-s); }
.wiki nav button:hover { background: var(--s2); color: var(--tx); }
.wiki nav button.on { background: var(--s3); color: var(--tx); }
.wiki article { padding: 22px 28px 40px; overflow-y: auto; min-width: 0; }
.wiki article h2 { margin: 0 0 6px; font-size: var(--fs-l); font-weight: 600; }
.wiki article h3 { margin: 26px 0 8px; font-size: var(--fs-m); font-weight: 600; }
.wiki article p, .wiki article li { color: var(--tx2); max-width: 72ch; }
.wiki article p b, .wiki article li b { color: var(--tx); font-weight: 500; }
.wiki article ul { padding-left: 18px; margin: 8px 0; display: grid; gap: 6px; }
.wiki .lead { color: var(--tx2); margin: 0 0 18px; }
.wt { width: 100%; border-collapse: collapse; font-size: var(--fs-s); margin: 10px 0; }
.wt td, .wt th { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.wt th { color: var(--tx3); font-weight: 400; font-size: var(--fs-xs); }
.wt td.r, .wt th.r { text-align: right; white-space: nowrap; }
.wt td:first-child { color: var(--tx); }
.tbl-wrap { overflow-x: auto; }
.loop { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
.loop span { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; background: var(--s2); font-size: var(--fs-s); }
.loop .ar { color: var(--tx3); background: none; padding: 0; }
.summary { display: grid; gap: 12px; justify-items: center; }
.summary .bars { display: flex; gap: 6px; align-items: flex-end; height: 56px; }
.summary .bars div { width: 22px; border-radius: 5px 5px 2px 2px; background: var(--c); display: flex; justify-content: center; font-size: 10px; color: var(--ink); padding-top: 2px; font-weight: 600; min-height: 16px; }

/* ---------- Responsive ---------- */
@media (max-width: 1180px) {
  .play { grid-template-columns: minmax(0, 1fr); }
  .rail { position: relative; top: 0; width: 100%; max-width: calc(6 * var(--cell) + 5 * var(--gap)); margin: 0 auto; }
}
@media (max-width: 760px) {
  :root { --cell: calc((100vw - 32px - 5 * 6px) / 6); --gap: 6px; --radius: 11px; --fs-l: 18px; --fs-xl: 30px; }
  .top { grid-template-columns: auto 1fr auto; gap: 8px; }
  .brand small, .ghost .lbl { display: none; }
  .ticks { display: none; }
  .days { justify-self: center; }
  .goals, .pets { grid-template-columns: minmax(0, 1fr); }
  .seg { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cell .beast svg { width: 26px; height: 26px; }
  .cell .lbl { display: none; }
  .cell .n { top: 4px; left: 6px; font-size: 10px; }
  .cell .lock svg { width: 16px; height: 16px; }
  .cell .flags, .cell .wtag { display: none; }
  .board { grid-template-rows: repeat(4, var(--cell)) auto; }
  .yard { grid-column: 1 / -1; grid-row: 5; padding: 18px 0 4px; gap: 8px; }
  .core { display: grid; }
  .picker { grid-template-columns: auto repeat(4, minmax(44px, 1fr)) !important; width: 100%; max-width: 380px; }
  .picker button { height: 42px; }
  .sec-h { flex-direction: column; gap: 2px; }
  .bubble { top: calc(10px + env(safe-area-inset-top, 0px)); bottom: auto; left: auto; right: max(100px, calc(env(safe-area-inset-right, 0px) + 100px)); width: 36px; height: 36px; border-radius: 12px; box-shadow: none; animation: none; background: transparent; }
  .bubble .b-btn { width: 36px; height: 36px; }
  .bubble .b-body { width: calc(100vw - 32px); }
  .bubble.open { right: 16px; width: calc(100vw - 32px); height: var(--bh, 420px); background: var(--s2); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
  .wiki { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
  .wiki nav { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; }
  .wiki nav button { white-space: nowrap; }
  .wiki article { padding: 18px 16px 40px; }
  .yard .acts .btn { height: 38px; padding: 0 14px; }
  .tools-grid { grid-template-columns: repeat(7, minmax(0, 1fr)); width: 100%; }
}
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
}

.evtoggle { display: grid; gap: 8px; justify-items: center; }
.evchip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 8px; border-radius: 999px; background: var(--s1); color: var(--tx2); font-size: var(--fs-s); }
.evchip:hover { background: var(--s2); color: var(--tx); }
.evchip i { width: 16px; height: 16px; border-radius: 50%; background: var(--s4); color: var(--tx2); font-style: normal; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.evchip.on { background: var(--s3); color: var(--tx); }
.evchip.on i { background: var(--tx); color: var(--ink); }
.hint { font-size: var(--fs-xs); color: var(--tx3); }

/* Cell editor: actions in a row above the picker, so the courtyard grows down instead of spilling over cells. */
.split { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; justify-items: center; text-align: center; }
.split .side { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.split .side h3 { margin: 0 0 4px; flex-basis: 100%; }
.split .opt { height: 32px; background: transparent; justify-content: flex-start; padding: 0 10px; }
.split .opt:hover { background: var(--s2); }
.split .opt.sel { background: var(--s3); box-shadow: none; color: var(--tx); }
.split .opt.quiet { color: var(--tx3); }
.picker.compact button { height: 28px; }
.picker .more { grid-column: 2 / -1; height: 24px; font-size: var(--fs-xs); color: var(--tx3); background: none; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--tx3); }
.picker .more:hover { color: var(--tx); background: none; transform: none; }
.picker.compact { gap: 3px 4px; }
.picker.compact .ch, .picker.compact .rl { font-size: 10px; }
.picker.compact .rb { height: 26px; }
.tools-grid { grid-template-columns: repeat(7, 40px); }
.tools-grid button { height: 40px; }
@@@END


/* ---------- Run history: grey stacks that take their chest colours on hover ---------- */
.hist { display: flex; align-items: flex-end; gap: 4px; min-height: 44px; flex-wrap: wrap; }
.hist .hbar { width: 10px; border-radius: 3px; display: flex; flex-direction: column; overflow: hidden; gap: 1px; background: var(--s3); position: relative; }
.hist .hbar i { display: block; flex-basis: 0; min-height: 1px; background: var(--s4); transition: background 240ms var(--ease) calc(var(--k, 0) * 40ms); }
.hist .hbar:hover i { background: var(--c); }
/* Neighbours tint faintly, so moving along the strip reads as colour flowing from bar to bar. */
.hist .hbar:hover + .hbar i, .hist .hbar:has(+ .hbar:hover) i { background: color-mix(in srgb, var(--c) 30%, var(--s4)); }
.tip .tt-h { display: grid; gap: 1px; margin-bottom: 8px; }
.tip .tt-h span { color: var(--tx3); font-size: var(--fs-xs); }
.tip .tt-g { display: grid; grid-template-columns: 1fr auto; gap: 3px 22px; font-size: var(--fs-xs); }
.tip .tt-r { display: flex; align-items: center; gap: 7px; color: var(--tx2); }
.tip .tt-r .dot { width: 7px; height: 7px; }
.tip .tt-g b { text-align: right; font-variant-numeric: tabular-nums; }
.tip .tt-sum { margin-top: 3px; padding-top: 4px; border-top: 1px solid rgba(255, 255, 255, 0.08); color: var(--tx3); }
.tip b.tt-sum { color: var(--tx); }
.tip .tt-fe { display: flex; justify-content: space-between; margin-top: 8px; padding: 6px 8px; border-radius: 7px; background: rgba(255, 255, 255, 0.05); font-size: var(--fs-xs); color: var(--tx2); }
.tip .tt-fe b { color: var(--tx); }
.tip .tt-x { margin-top: 6px; color: var(--tx3); font-size: var(--fs-xs); }
.hist .hbar.lucky::after { content: ''; position: absolute; left: 3px; top: 3px; width: 4px; height: 4px; border-radius: 50%; background: var(--r5); }
.hist.small .hbar { width: 7px; }
.sec-act { margin-left: auto; display: flex; align-items: center; justify-content: flex-end; gap: 10px 14px; flex-wrap: wrap; }
.sec-links { display: flex; align-items: center; gap: 14px; white-space: nowrap; }
.sec-act .btn.small svg { width: 16px; height: 16px; }
.linkish.danger { color: var(--danger); text-decoration-color: var(--danger); }
.disk { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-s); color: var(--tx2); }
.disk svg { width: 15px; height: 15px; color: #8fd4a4; }

/* Setup groups: hairlines between groups and sub-groups instead of boxes */
.sec.group { border-top: 1px solid var(--line); padding-top: 30px; }
.bonus-body .sub { display: grid; gap: 12px; }
.bonus-body .sub + .sub { border-top: 1px solid rgba(42, 47, 54, 0.7); padding-top: 18px; }
/* Sub-group titles are anchors for the eye: brighter than the body text, never dimmer. */
.subh { margin: 0; font-size: var(--fs-s); font-weight: 600; color: var(--tx); letter-spacing: 0.01em; }

/* Margin notes: quiet comments beside the block they explain; inline under it when there is no room */
.has-note { position: relative; }
.mnote { display: block; font-size: 12.5px; line-height: 1.6; color: color-mix(in srgb, var(--tx2) 72%, var(--tx3)); border-left: 2px solid var(--s3); padding: 2px 0 2px 14px; }
.mnote b { color: var(--tx); font-weight: 600; }
@media (min-width: 1400px) {
  .mnote { position: absolute; top: 34px; width: 248px; }
  .mnote.right { left: calc(100% + 30px); }
  .mnote.left { right: calc(100% + 30px); text-align: right; border-left: 0; border-right: 2px solid var(--s3); padding: 2px 14px 2px 0; }
  .sec > .mnote.right { top: 46px; }
}
/* Run log under the board: peripheral, so it stays dim and apart until the pointer reaches it. */
.minihist { position: relative; display: grid; gap: 6px; justify-items: center; color: var(--tx3); font-size: var(--fs-xs); margin-top: 26px; padding-top: 16px; opacity: 0.45; transition: opacity var(--t-mid) var(--ease); }
.minihist::before { content: ''; position: absolute; top: 0; left: 50%; width: 36px; height: 1px; background: var(--line); transform: translateX(-50%); }
.minihist:hover { opacity: 1; }
.note.store { display: flex; align-items: center; gap: 6px; margin: 0; }
.note.store > svg { width: 14px; height: 14px; flex: none; }
.side section.attn { background: var(--s2); box-shadow: inset 0 0 0 1px rgba(232, 238, 246, 0.45); animation: hotPulse 1.8s ease-in-out infinite; }
.steps { display: flex; gap: 6px; justify-content: center; }
.steps span { font-size: var(--fs-xs); color: var(--tx3); padding: 3px 9px; border-radius: 999px; background: var(--s1); }
.steps span.on { color: var(--ink); background: var(--lantern); }
.steps span.done { color: var(--tx2); }
.daynum { align-self: center; min-width: 64px; text-align: center; }
.minihist:empty { display: none; }
.minihist .hist { min-height: 0; justify-content: center; }

/* ---------- Setup additions ---------- */
.goal.is-rec { box-shadow: inset 0 0 0 1px rgba(214, 222, 232, 0.28); }
.goal.is-rec.on { box-shadow: inset 0 0 0 1px rgba(232, 236, 242, 0.7), 0 0 24px rgba(222, 230, 240, 0.06); }
.goal .rec { position: static; margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-xs); color: var(--tx2); }
.goal .rec svg { width: 15px; height: 15px; fill: url(#silver); stroke: none; filter: drop-shadow(0 0 4px rgba(230, 236, 244, 0.35)); }
.pet .p-mult { margin-left: auto; font-size: var(--fs-s); font-weight: 600; }
.switch-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.seg .segi { display: grid; gap: 6px; border-radius: 10px; padding-bottom: 6px; }
.seg .segi.on { background: var(--s3); box-shadow: inset 0 0 0 1px rgba(232, 236, 242, 0.45); }
.seg .segi button { padding: 10px 8px 2px; border-radius: 10px; text-align: left; display: grid; gap: 2px; }
.seg .segi button b { font-weight: 500; font-size: var(--fs-s); }
.seg .segi button span { color: var(--tx3); font-size: var(--fs-xs); }
.price, .logform input { width: 100%; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--tx); padding: 0 8px; font: inherit; font-size: var(--fs-s); }
.price { width: calc(100% - 16px); margin: 0 8px; }
.price:focus, .logform input:focus { outline: none; border-color: var(--tx3); }
.verdict { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--tx2); font-size: var(--fs-s); }
.verdict b { color: var(--tx); font-weight: 500; }
.note b { color: var(--tx2); font-weight: 600; }
.rbtext { background: var(--r5-line); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 600; }

/* ---------- Side panel ---------- */
.side { position: sticky; top: 72px; display: grid; gap: 0; background: var(--s1); border-radius: 18px; overflow: hidden; align-self: start; }
.side:empty { display: none; }
.side section { padding: 16px 18px; display: grid; gap: 10px; }
.side section + section { border-top: 1px solid var(--line); }
.side h4 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: var(--fs-s); font-weight: 500; color: var(--tx2); }
.side h4 .grow { flex: 1; }
.side .muted { color: var(--tx3); font-size: var(--fs-s); margin: 0; }
.why-h { display: flex; align-items: center; gap: 8px; width: 100%; font-size: var(--fs-s); font-weight: 500; color: var(--tx2); text-align: left; }
.why-h span { flex: 1; }
.why-h .chev { width: 16px; height: 16px; color: var(--tx3); transition: transform var(--t-mid) var(--ease); }
.why.open .why-h .chev { transform: rotate(90deg); }
.why-b { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--t-mid) var(--ease), opacity var(--t-mid) var(--ease); opacity: 0; }
.why.open .why-b { grid-template-rows: 1fr; opacity: 1; }
.why-b > div { overflow: hidden; }
.why-b p { margin: 8px 0 0; color: var(--tx2); font-size: var(--fs-s); line-height: 1.5; }
.why-b .why-num { color: var(--tx3); font-size: var(--fs-xs); }
.tlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.tlist li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; margin: 0 -8px; border-radius: 9px; font-size: var(--fs-s); color: var(--tx); cursor: default; }
.tlist li:hover { background: var(--s2); }
.tlist li span:not(.tier) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.tchip { position: relative; width: 100%; height: 38px; border-radius: 10px; background: var(--s2); display: grid; place-items: center; color: var(--tx3); transition: background var(--t-fast), color var(--t-fast), box-shadow var(--t-fast); }
.tchip:hover { background: var(--s3); color: var(--tx); }
.tchip.on { background: var(--s3); color: var(--tx); box-shadow: inset 0 0 0 1.5px var(--tx2); }
.tier { display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding: 0 3px; border-radius: 5px; font-size: 10px; font-weight: 700; line-height: 1; color: var(--ink); background: var(--s4); }
.tier.t-S { background: var(--lantern); }
.tier.t-A { background: #b9c3d0; }
.tier.t-B { background: #7f8a98; }
.tier.t-C { background: #555e6a; color: var(--tx); }
.tier.t-D { background: var(--s3); color: var(--tx3); }
.tools-grid button { position: relative; }
.tt-how { color: var(--tx2); font-size: var(--fs-xs); }
.toolnotes { display: grid; gap: 4px; max-width: 52ch; }
.toolnotes p { margin: 0; font-size: var(--fs-xs); color: var(--tx2); line-height: 1.5; }
.vrow { display: flex; align-items: center; gap: 10px; font-size: var(--fs-s); color: var(--tx2); }
.vrow span { flex: 1; }
.vrow b { color: var(--tx); font-size: var(--fs-m); min-width: 14px; text-align: center; }
.rbdot { width: 10px; height: 10px; border-radius: 50%; background: var(--r5); flex: none; }

/* ---------- Courtyard motion: cross-fade between prompts, end-of-run log ---------- */
.yard > .ycontent { grid-area: 1 / 1; }
/* The leaving prompt is taken out of the flow so the ring sizes to the new one only. */
.swap-out { animation: fadeOut 110ms var(--ease) forwards; position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; }
.yard > .ycontent.swap-in { animation-delay: 90ms; }
.logform { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center; }
.logform input { width: 112px; height: 28px; font-size: var(--fs-xs); background: var(--s1); border-color: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.logform .switch { font-size: var(--fs-xs); gap: 8px; }
.logform .lf { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-xs); color: var(--tx2); }
.logform .lf-sep { width: 1px; height: 18px; background: var(--line); }
.logform { gap: 6px 8px; }
.logform .qhelp { margin-right: 4px; }
.logform .switch i { width: 26px; height: 15px; }
.logform .switch i::after { top: 2.5px; left: 2.5px; width: 10px; height: 10px; }
.logform .switch.on i::after { transform: translateX(11px); }
.dicei.roll { animation: diceRoll 520ms var(--snap); transform-origin: 50% 50%; transform-box: fill-box; }
@keyframes diceRoll { 0% { transform: rotate(0) scale(1); } 45% { transform: rotate(200deg) scale(0.8); } 100% { transform: rotate(360deg) scale(1); } }
.evtoggle { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px; padding: 5px 6px 5px 14px; border-radius: 999px; background: color-mix(in srgb, var(--s2) 60%, transparent); box-shadow: inset 0 0 0 1px var(--line); }
.evtoggle .evq { font-size: var(--fs-s); color: var(--tx2); margin-right: 4px; }
.evchip { box-shadow: inset 0 0 0 1px var(--line); }
.evchip i { background: var(--s4); }
.evchip.on { box-shadow: inset 0 0 0 1px rgba(232, 238, 246, 0.6); }

<script id="core-src">
/* Tartarus Co-Pilot core: rules engine, exact odds, policy and rollouts.
 * No DOM. Runs in the page, in a Web Worker and under Node.
 * Rules mirror the fan simulator (blahdot3h/tartarus-simulator, single-meal chain),
 * re-implemented independently. Cells 0..15 clockwise, cell 0 = warden's office. */
(function (root) {
  'use strict';

  const CELLS = 16, OFFICE = 0, SUPREME = 4, RAINBOW = 5;
  const BEASTS = ['mammoth', 'lion', 'wolf', 'rat'];
  const M = 0, L = 1, W = 2, R = 3;
  // Single-meal loop: Mammoth eats Lion, Lion eats Wolf, Wolf eats Rat, Rat eats Mammoth.
  const EATS = [L, W, R, M];
  const TOOL_IDS = ['skewer', 'revenge', 'rope', 'saw', 'guillotine', 'hook', 'tongs', 'keys', 'muzzle', 'fire', 'scales', 'pestle', 'ironbox'];
  const GIFT_IDS = ['wine', 'ring', 'brand', 'horn'];

  // tierW / swapW / eventChance are priors: the page replaces them with estimates smoothed by the player's own log.
  // eventChance: the fan sim uses 18% with no source; early analyzer boards from the live client show far fewer.
  const DEFAULT_RULES = {
    days: 20, doors: 3, range: 5, tierW: [52, 27, 15, 6, 0], swapW: null, eventChance: 10,
    rewards: true, preyRounds: 3, nestDays: 2, nestTier: 2, tuskCount: 4,
    // The fan sim keeps a Tusk mark on the cell after a swap; the card marks the Mammoth itself,
    // so by default the mark leaves with the swapped-out inmate.
    tuskStays: false,
    // Instrument offers. toolW: offer weight per TOOL_IDS entry (null = uniform), learned from the player's log.
    // Live boards show runs with two or more instruments, from a source not known yet: extraN[k] is the chance of
    // k more offers after the current state, each on a day drawn from extraDays (the page fills both from its log).
    toolW: null, extraN: null, extraDays: [],
  };

  // ---------- RNG ----------
  function rng32(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const pick = (rnd, arr) => arr[(rnd() * arr.length) | 0];
  function pickW(rnd, w) {
    let tot = 0;
    for (let i = 0; i < w.length; i++) tot += w[i];
    let x = rnd() * tot;
    for (let i = 0; i < w.length; i++) { x -= w[i]; if (x < 0) return i; }
    return w.length - 1;
  }
  function shuffle(rnd, arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  // ---------- State ----------
  // cell: { s: sealed, b: beast|-1, t: tier, id, ev: null|'chain'|'exec'|'?', nest: dueDay|0,
  //         tusk: bool, scratch: tier|-1 (scratched sealed door showing its rarity) }
  function blank(n) { return { s: n !== OFFICE, b: -1, t: 0, id: 0, ev: null, nest: 0, tusk: false, scratch: -1, fr: n !== OFFICE }; }

  function newState(opts) {
    const o = opts || {};
    const rules = Object.assign({}, DEFAULT_RULES, o.rules || {});
    const s = {
      rules, day: 1, pos: OFFICE, phase: 'patrol', dest: [], chain: false, event: null,
      cells: Array.from({ length: CELLS }, (_, n) => blank(n)),
      vault: 0, tools: {}, toolList: [], milestone: false, pending: [], used: { dev: 0, swap: 0 },
      prey: [], nextId: 1, refreshes: o.refreshes || 0,
    };
    for (const id of o.tools || []) addTool(s, id);
    return s;
  }

  function clone(s) {
    return {
      rules: s.rules, day: s.day, pos: s.pos, phase: s.phase, dest: s.dest.slice(), chain: s.chain,
      event: s.event ? Object.assign({}, s.event) : null,
      cells: s.cells.map((c) => ({ s: c.s, b: c.b, t: c.t, id: c.id, ev: c.ev, nest: c.nest, tusk: c.tusk, scratch: c.scratch, fr: c.fr })), extraQueue: s.extraQueue ? s.extraQueue.slice() : null,
      vault: s.vault, tools: Object.assign({}, s.tools), toolList: s.toolList.slice(), milestone: s.milestone,
      pending: s.pending.map((p) => ({ kind: p.kind, options: p.options.slice() })), used: { dev: s.used.dev, swap: s.used.swap },
      prey: s.prey.map((p) => Object.assign({}, p)), nextId: s.nextId, refreshes: s.refreshes,
    };
  }

  function drawOffer(s, rnd) {
    const pool = TOOL_IDS.filter((t) => !s.tools[t]);
    if (!rnd) return pool.slice(0, 3);
    const W = s.rules.toolW, out = [];
    while (out.length < 3 && pool.length) {
      const w = pool.map((t) => (W ? Math.max(1e-6, W[TOOL_IDS.indexOf(t)]) : 1));
      out.push(pool.splice(pickW(rnd, w), 1)[0]);
    }
    return out;
  }
  function addTool(s, id) { if (!s.tools[id]) { s.tools[id] = true; s.toolList.push(id); } }
  const has = (s, id) => !!s.tools[id];
  const onBoard = (c) => !c.s && c.b >= 0;
  function crowd(s) { let k = 0; for (const c of s.cells) if (onBoard(c)) k++; return k; }
  function findId(s, id) { for (let n = 0; n < CELLS; n++) { const c = s.cells[n]; if (!c.s && c.b >= 0 && c.id === id) return n; } return -1; }
  const daysLeft = (s) => s.rules.days - s.day;

  function doorWeights(s) { const w = s.rules.tierW.slice(); if (has(s, 'hook')) w[0] = 0; return w; }
  function swapWeights(s) { const w = (s.rules.swapW || s.rules.tierW).slice(); if (has(s, 'rope')) { w[0] = 0; w[1] = 0; } return w; }
  function norm(w) { let t = 0; for (const x of w) t += x; return w.map((x) => x / t); }

  function canEat(s, eb, et, mb, mt) {
    if (et >= RAINBOW) return false;
    if (et !== mt) return et > mt && eb === W && mb === R && has(s, 'guillotine');
    return EATS[eb] === mb || (eb === R && mb === R && has(s, 'skewer'));
  }

  function devourOptions(s, n) {
    const e = s.cells[n];
    if (!onBoard(e)) return [];
    const out = [];
    for (let k = 0; k < CELLS; k++) {
      if (k === n) continue;
      const c = s.cells[k];
      if (onBoard(c) && canEat(s, e.b, e.t, c.b, c.t)) out.push(k);
      else if (c.s && e.b === W && c.scratch >= 0 && c.scratch === e.t && e.t < RAINBOW) out.push(k);
    }
    return out;
  }

  // ---------- Effects ----------
  function emptyCell(s, n) {
    const c = s.cells[n];
    c.b = -1; c.t = 0; c.id = 0; c.s = n !== OFFICE; c.nest = 0; c.tusk = false; c.scratch = -1; c.fr = false;
  }
  function setInmate(s, n, b, t) {
    const c = s.cells[n];
    c.s = false; c.b = b; c.t = Math.min(t, RAINBOW); c.id = s.nextId++; c.nest = 0; c.scratch = -1; c.ev = null; c.fr = false;
    afterGrowth(s, n);
  }
  function afterGrowth(s, n) {
    const c = s.cells[n];
    if (s.rules.rewards && !s.milestone && c.t >= SUPREME) {
      s.milestone = true;
      const options = drawOffer(s, s._rnd);
      if (options.length) s.pending.push({ kind: 'tool', options });
    }
    if (c.t >= RAINBOW) {
      emptyCell(s, n);
      s.vault += 1;
      if (s.rules.rewards) s.pending.push({ kind: 'gift', options: GIFT_IDS.slice() });
    }
  }
  function promote(s, n, by, reroll, rnd) {
    const c = s.cells[n];
    c.t = Math.min(RAINBOW, c.t + by);
    if (reroll && c.t < RAINBOW) c.b = (rnd() * 4) | 0;
    afterGrowth(s, n);
  }
  function checkPrey(s) {
    s.prey = s.prey.filter((p) => {
      const a = findId(s, p.lion), b = findId(s, p.prey);
      return a >= 0 && b >= 0 && s.cells[a].b === L && s.cells[b].b === p.preyBeast;
    });
  }

  // Opens a sealed cell. how: 'patrol' | 'side'. forced: {b,t} or null. Returns the event behind a patrolled door.
  function openCell(s, n, how, rnd, forced) {
    const c = s.cells[n];
    if (!c.s || n === OFFICE) return null;
    const ev = c.ev;
    let b, t;
    if (forced) { b = forced.b; t = forced.t; }
    else if (c.scratch >= 0) { t = c.scratch; b = (rnd() * 4) | 0; }
    else { t = pickW(rnd, doorWeights(s)); b = (rnd() * 4) | 0; }
    c.ev = null;
    setInmate(s, n, b, t);
    if (how === 'patrol' && has(s, 'fire') && rnd() < 0.35 && !s.cells[n].s) {
      const sealed = []; for (let k = 1; k < CELLS; k++) if (s.cells[k].s) sealed.push(k);
      if (sealed.length) openCell(s, pick(rnd, sealed), 'side', rnd, { b: s.cells[n].b, t: s.cells[n].t });
    }
    if (how === 'patrol' && has(s, 'keys') && rnd() < 0.8) {
      openCell(s, (n + 1) % CELLS, 'side', rnd); openCell(s, (n + CELLS - 1) % CELLS, 'side', rnd);
    }
    return how === 'patrol' ? ev : null;
  }

  function windowCells(pos, range) {
    const out = [];
    for (let i = 1; i < CELLS && (i <= range || !out.length); i++) { const n = (pos + i) % CELLS; if (n !== OFFICE) out.push(n); }
    return out;
  }
  const steps = (a, b) => (b - a + CELLS) % CELLS;

  function rollDest(s, rnd) {
    const w = windowCells(s.pos, s.rules.range);
    s.dest = shuffle(rnd, w).slice(0, s.rules.doors).sort((a, b) => steps(s.pos, a) - steps(s.pos, b));
  }

  function beginDay(s, rnd) {
    s.phase = 'patrol'; s.used = { dev: 0, swap: 0 };
    checkPrey(s);
    for (const p of s.prey.slice()) {
      if (p.next > s.day) continue;
      p.rounds -= 1; p.next = s.day + 1;
      const a = findId(s, p.lion), b = findId(s, p.prey);
      if (p.rounds <= 0) s.prey = s.prey.filter((x) => x !== p);
      if (a >= 0) promote(s, a, 1, false, rnd);
      const b2 = findId(s, p.prey);
      if (b2 >= 0) promote(s, b2, 1, false, rnd);
      void b;
    }
    checkPrey(s);
    for (let n = 1; n < CELLS; n++) { const c = s.cells[n]; if (c.s && c.nest && c.nest <= s.day) { c.nest = 0; openCell(s, n, 'side', rnd, { b: R, t: s.rules.nestTier }); } }
    if (has(s, 'tongs')) {
      const ms = []; for (let n = 1; n < CELLS; n++) { const c = s.cells[n]; if (onBoard(c) && c.b === M && !c.tusk) ms.push(n); }
      if (ms.length) s.cells[pick(rnd, ms)].tusk = true;
    }
    while (s.extraQueue && s.extraQueue.length && s.extraQueue[0] <= s.day) {
      s.extraQueue.shift();
      const options = drawOffer(s, rnd);
      if (options.length) s.pending.push({ kind: 'tool', options });
    }
    if (has(s, 'ironbox')) {
      const f = []; for (let n = 1; n < CELLS; n++) { const c = s.cells[n]; if (c.s && !c.nest) f.push(n); }
      if (f.length) s.cells[pick(rnd, f)].nest = s.day + s.rules.nestDays;
    }
    rollDest(s, rnd);
  }

  function startGame(s, rnd, withEvents) {
    s._rnd = rnd;
    if (withEvents !== false) for (let n = 1; n < CELLS; n++) if (s.cells[n].s && rnd() * 100 < s.rules.eventChance) s.cells[n].ev = rnd() < 0.5 ? 'chain' : 'exec';
    beginDay(s, rnd);
    return s;
  }

  // ---------- Actions ----------
  function patrol(s, n, rnd) {
    s._rnd = rnd;
    let ev = null;
    if (s.chain) {
      let k = s.pos;
      while (k !== n) { k = (k + 1) % CELLS; openCell(s, k, 'side', rnd); }
      s.chain = false;
    } else if (s.cells[n].s) {
      ev = openCell(s, n, 'patrol', rnd);
      if (ev === '?') ev = rnd() < 0.5 ? 'chain' : 'exec';
    }
    s.pos = n;
    checkPrey(s);
    if (ev && onBoard(s.cells[n])) { s.phase = 'event'; s.event = { kind: ev, cell: n }; }
    else s.phase = 'manage';
  }

  function execVictims(s, n) {
    const e = s.cells[n]; const out = [];
    if (!onBoard(e)) return out;
    for (let k = 1; k < CELLS; k++) { const c = s.cells[k]; if (k !== n && onBoard(c) && c.b === EATS[e.b] && c.t < e.t) out.push(k); }
    return out;
  }

  function resolveEvent(s, accept, rnd) {
    s._rnd = rnd;
    const ev = s.event; s.event = null; s.phase = 'manage';
    if (!accept || !ev) return;
    if (ev.kind === 'chain') { s.chain = true; return; }
    const v = execVictims(s, ev.cell);
    for (const k of v) emptyCell(s, k);
    checkPrey(s);
    if (v.length) promote(s, ev.cell, v.length, false, rnd);
  }

  function biteOnce(s, from, to, rnd) {
    const e = s.cells[from], m = s.cells[to];
    const scratch = m.s;
    const wasRat = e.b === R;
    const k = crowd(s);
    emptyCell(s, to);
    let gain = scratch ? 3 : 1;
    if (has(s, 'muzzle') && k <= 3) gain += 2;
    if (has(s, 'skewer') && wasRat) gain += 1;
    if (has(s, 'saw') && rnd() < 0.25) gain += 1;
    const rev = has(s, 'revenge') && rnd() < 0.3;
    const id = e.id;
    promote(s, from, gain, true, rnd);
    checkPrey(s);
    const n = findId(s, id);
    if (rev && n >= 0) {
      const sealed = []; for (let q = 1; q < CELLS; q++) if (s.cells[q].s) sealed.push(q);
      if (sealed.length) openCell(s, pick(rnd, sealed), 'side', rnd, { b: EATS[s.cells[n].b], t: s.cells[n].t });
    }
    return n;
  }

  // Devour from the warden's cell into `to`; the chain then runs at random. Returns bites.
  function devour(s, to, rnd) {
    s._rnd = rnd;
    s.used.dev += 1;
    let n = biteOnce(s, s.pos, to, rnd), bites = 1;
    while (n >= 0) {
      const o = devourOptions(s, n);
      if (!o.length) break;
      n = biteOnce(s, n, pick(rnd, o), rnd); bites++;
    }
    return bites;
  }

  function swap(s, rnd) {
    s._rnd = rnd;
    const c = s.cells[s.pos];
    const oldB = c.b;
    s.used.swap += 1;
    c.b = -1; checkPrey(s);
    const t = pickW(rnd, swapWeights(s));
    const b = has(s, 'pestle') ? oldB : (rnd() * 4) | 0;
    setInmate(s, s.pos, b, t);
    if (has(s, 'scales') && rnd() < 0.8) { /* scouting changes knowledge only; ignored in rollouts */ }
    if (c.tusk && onBoard(c)) {
      if (!s.rules.tuskStays) c.tusk = false;
      const pool = []; for (let n = 1; n < CELLS; n++) if (onBoard(s.cells[n])) pool.push(s.cells[n].id);
      for (const id of shuffle(rnd, pool).slice(0, s.rules.tuskCount)) { const n = findId(s, id); if (n >= 0) promote(s, n, 1, false, rnd); }
    }
  }

  function applyGift(s, id, rnd) {
    s._rnd = rnd;
    if (id === 'ring') {
      const sealed = []; for (let n = 1; n < CELLS; n++) if (s.cells[n].s) sealed.push(n);
      for (const n of shuffle(rnd, sealed).slice(0, 3)) openCell(s, n, 'side', rnd);
    } else if (id === 'wine') {
      const ids = []; for (let n = 1; n < CELLS; n++) { const c = s.cells[n]; if (onBoard(c) && c.t < 3) ids.push(c.id); }
      for (const i of ids) { const n = findId(s, i); if (n >= 0) promote(s, n, 1, false, rnd); }
    } else if (id === 'horn') {
      const ids = []; for (let n = 1; n < CELLS; n++) if (onBoard(s.cells[n]) && devourOptions(s, n).length) ids.push(s.cells[n].id);
      for (const i of ids) {
        const n = findId(s, i); if (n < 0) continue;
        const o = devourOptions(s, n).filter((k) => !s.cells[k].s); if (!o.length) continue;
        biteOnce(s, n, pick(rnd, o), rnd);
      }
    } else if (id === 'brand') {
      const hungry = []; for (let n = 1; n < CELLS; n++) if (onBoard(s.cells[n]) && !devourOptions(s, n).length) hungry.push(s.cells[n].id);
      for (const i of shuffle(rnd, hungry).slice(0, 4)) {
        const n = findId(s, i); if (n < 0 || devourOptions(s, n).length) continue;
        const c = s.cells[n];
        const ok = [0, 1, 2, 3].filter((b) => s.cells.some((o, k) => k !== n && onBoard(o) && canEat(s, b, c.t, o.b, o.t)));
        if (ok.length) c.b = pick(rnd, ok);
      }
      checkPrey(s);
    }
  }

  // Torture instrument refresh (Twin Inquisitors): a new offer of 3 from the instruments not held.
  function refreshOffer(s, rnd) {
    const p = s.pending[0];
    if (!p || p.kind !== 'tool' || s.refreshes < 1) return;
    s.refreshes -= 1;
    p.options = drawOffer(s, rnd);
  }

  function choose(s, id, rnd) {
    const p = s.pending.shift();
    if (!p) return;
    if (p.kind === 'gift') applyGift(s, id, rnd); else addTool(s, id);
  }

  function endDay(s, rnd) {
    s._rnd = rnd;
    if (s.day >= s.rules.days) { s.phase = 'ended'; s.dest = []; return; }
    s.day += 1;
    beginDay(s, rnd);
  }

  // ---------- Objectives (what a run is worth) ----------
  // V[t]: worth of one inmate of tier t at the riot (one Warden's Cache of its rarity);
  // V[5] is a Chromatic (Rainbow) prisoner. `risk`: utility bonus for multi-Rainbow runs.
  const GOALS = {
    rainbow: { V: [0, 0, 0, 0, 0, 1], scale: 10 },
    value: { V: [1, 2, 4, 8, 16, 48], scale: 1 },
    mass: { V: [1, 1.4, 1.96, 2.74, 3.84, 6], scale: 1 },
    high: { V: [0, 0, 1, 3, 9, 27], scale: 1 },
    jackpot: { V: [0, 0, 0, 0, 0, 1], scale: 10, risk: true },
  };
  function customGoal(tiers) {
    // tiers: array of chosen tier indexes (0..5). Chosen tiers get doubling worth, others a trace.
    const V = [1, 2, 4, 8, 16, 48].map((x, t) => (tiers.includes(t) ? x : 0.04 * x));
    return { V, scale: 1 };
  }
  function goalOf(g) { return typeof g === 'string' ? GOALS[g] || GOALS.value : g; }

  function terminalValue(s, goal) {
    const V = goal.V;
    let v = s.vault * V[RAINBOW];
    for (let n = 1; n < CELLS; n++) { const c = s.cells[n]; if (onBoard(c)) v += V[c.t]; }
    return v;
  }
  function utility(s, goal) {
    if (goal.risk) return s.vault * s.vault; // convex: rewards stacking Rainbows in one run
    return terminalValue(s, goal);
  }

  // ---------- Policy ----------
  const BASE_PARAMS = {
    alpha: 1, hBase: 2.75, wOpen: 2, wNow: 1.1, wWalk: 1, wStep: 0.25, wChain: 4, wNest: -6,
    swapMargin: 0, minDevour: 0, execMargin: 0, wCell: 0.5, decay: 6, giftV: 0,
    toolRank: ['skewer', 'revenge', 'rope', 'saw', 'guillotine', 'hook', 'tongs', 'keys', 'muzzle', 'fire', 'scales', 'pestle', 'ironbox'],
  };

  function makeCtx(s, goal, P) {
    const V = goal.V;
    const dl = daysLeft(s);
    const f = Math.min(1, dl / Math.max(0.5, P.decay));
    const top = Math.max(V[RAINBOW], 1e-9);
    const H = V.map((v, t) => v + P.alpha * f * top * Math.pow(1 / P.hBase, RAINBOW - t));
    H[RAINBOW] = V[RAINBOW] + P.giftV * f * (s.rules.rewards ? 1 : 0) * top;
    const dd = norm(doorWeights(s));
    const sd = norm(swapWeights(s));
    let sealed = 0; for (let n = 1; n < CELLS; n++) if (s.cells[n].s) sealed++;
    const openH = dd.reduce((a, p, t) => a + p * H[t], 0);
    // A freed cell matters only while doors (not days) are the bottleneck.
    const cellB = P.wCell * openH * (sealed < dl ? 1 : 0);
    const eats = [[L], [W], [R], [M]];
    if (has(s, 'skewer')) eats[R] = [M, R];
    return {
      s, P, V, H, dd, sd, openH, cellB, eats, memo: new Map(),
      saw: has(s, 'saw'), muzzle: has(s, 'muzzle'), skewer: has(s, 'skewer'),
      revenge: has(s, 'revenge') && sealed > 0,
      swapH: sd.reduce((a, p, t) => a + p * H[t], 0),
    };
  }

  function comp(s, exclude) {
    const c = new Array(24).fill(0); let k = 0;
    for (let n = 1; n < CELLS; n++) { const x = s.cells[n]; if (!onBoard(x)) continue; k++; if (n !== exclude && x.t < RAINBOW) c[x.t * 4 + x.b]++; }
    return { c, k };
  }

  // Expected H-value from an eater that has just reached tier t (beast re-rolls), with the random chain after.
  function rise(ctx, t, c, k) {
    if (t >= RAINBOW) return ctx.H[RAINBOW] + ctx.cellB;
    let sum = 0;
    for (let b = 0; b < 4; b++) {
      if (ctx.revenge) {
        const foods = [EATS[b]];
        let spawned = 0;
        for (const f of foods) { c[t * 4 + f]++; spawned += ctx.H[t] + feed(ctx, t, b, c, k + 1); c[t * 4 + f]--; }
        sum += 0.3 * spawned / foods.length + 0.7 * feed(ctx, t, b, c, k);
      } else sum += feed(ctx, t, b, c, k);
    }
    return sum / 4;
  }
  function feed(ctx, t, b, c, k) {
    let key = t * 4 + b + (ctx.muzzle ? 100 * Math.min(k, 4) : 0) + ':';
    for (let i = t * 4; i < 20; i++) key += String.fromCharCode(48 + c[i]);
    const hit = ctx.memo.get(key);
    if (hit !== undefined) return hit;
    let tot = 0;
    for (const f of ctx.eats[b]) tot += c[t * 4 + f];
    let out = ctx.H[t];
    if (tot) {
      let sum = 0;
      for (const f of ctx.eats[b]) {
        const q = c[t * 4 + f]; if (!q) continue;
        c[t * 4 + f]--; sum += q * bite(ctx, t, b, c, k, 0); c[t * 4 + f]++;
      }
      out = sum / tot;
    }
    ctx.memo.set(key, out);
    return out;
  }
  function bite(ctx, t, b, c, k, extra) {
    let g = 1 + extra;
    if (ctx.muzzle && k <= 3) g += 2;
    if (ctx.skewer && b === R) g += 1;
    const after = (x) => rise(ctx, Math.min(RAINBOW, t + x), c, k - 1);
    return -ctx.H[t] + ctx.cellB + (ctx.saw ? 0.75 * after(g) + 0.25 * after(g + 1) : after(g));
  }
  function devourDelta(ctx, tier, beast, mealB, scratch, c, k) {
    if (!scratch) c[tier * 4 + mealB]--;
    const v = bite(ctx, tier, beast, c, k, scratch ? 2 : 0) - ctx.H[tier];
    if (!scratch) c[tier * 4 + mealB]++;
    return v;
  }
  function bestMealValue(ctx, tier, beast, c, k) {
    let best = -Infinity;
    for (const f of ctx.eats[beast]) { if (!c[tier * 4 + f]) continue; const v = devourDelta(ctx, tier, beast, f, false, c, k); if (v > best) best = v; }
    return best;
  }
  function swapGain(ctx, tier) { return ctx.swapH - ctx.H[tier]; }
  function activation(ctx, tier, beast, c, k, swapLeft) {
    let v = 0;
    if (tier < RAINBOW) v = Math.max(v, bestMealValue(ctx, tier, beast, c, k));
    if (swapLeft) v = Math.max(v, swapGain(ctx, tier) - ctx.P.swapMargin * ctx.openH);
    return v;
  }
  function freshActivation(ctx, c, k, swapLeft) {
    let sum = 0;
    for (let t = 0; t < 5; t++) { const p = ctx.dd[t]; if (!p) continue; for (let b = 0; b < 4; b++) sum += p / 4 * activation(ctx, t, b, c, k, swapLeft); }
    return sum;
  }
  function execValue(ctx, tier, beast, c) {
    let cnt = 0, lost = 0;
    for (let t = 0; t < tier; t++) { const q = c[t * 4 + EATS[beast]]; cnt += q; lost += q * ctx.H[t]; }
    if (!cnt) return 0;
    const to = Math.min(RAINBOW, tier + cnt);
    return ctx.H[to] - ctx.H[tier] - lost + cnt * ctx.cellB;
  }

  function preyLoss(s, ctx, n, certain) {
    const c = s.cells[n];
    if (!onBoard(c)) return 0;
    const p = s.prey.find((x) => x.lion === c.id || x.prey === c.id);
    if (!p) return 0;
    let v = 0;
    for (const id of [p.lion, p.prey]) { const q = findId(s, id); if (q < 0) continue; const t = s.cells[q].t; v += ctx.H[Math.min(RAINBOW, t + p.rounds)] - ctx.H[t]; }
    return v * (certain || p.prey === c.id ? 1 : 0.75);
  }

  function patrolScores(s, ctx) {
    const P = ctx.P;
    const { c, k } = comp(s, -1);
    const swapLeft = s.used.swap < 1;
    let fresh = null;
    const freshNow = () => (fresh === null ? (fresh = P.wOpen * ctx.openH + P.wNow * freshActivation(ctx, c, k + 1, swapLeft)) : fresh);
    return s.dest.map((n) => {
      const cell = s.cells[n];
      let score = P.wStep * ctx.openH * steps(s.pos, n);
      if (s.chain) {
        let sealed = 0, q = s.pos;
        while (q !== n) { q = (q + 1) % CELLS; if (s.cells[q].s) sealed++; }
        score += P.wOpen * (sealed - (cell.s ? 1 : 0)) * ctx.openH + (cell.s ? freshNow() : onBoard(cell) ? P.wWalk * known(n) : 0);
      } else if (cell.s && cell.nest) score += P.wNest * ctx.openH;
      else if (cell.s) {
        score += freshNow();
        if (cell.ev) {
          let ex = 0;
          for (let t = 0; t < 5; t++) for (let b = 0; b < 4; b++) ex += ctx.dd[t] / 4 * Math.max(0, execValue(ctx, t, b, c) - P.execMargin * ctx.openH);
          const ch = P.wChain * ctx.openH;
          score += cell.ev === 'chain' ? ch : cell.ev === 'exec' ? ex : 0.5 * ch + 0.5 * ex;
        }
        if (cell.scratch >= 0) score += 0; // rarity shown; treat as normal door
      } else if (onBoard(cell)) score += P.wWalk * known(n);
      return { cell: n, score };
    }).sort((a, b) => b.score - a.score);
    function known(n) {
      const x = comp(s, n);
      const cl = s.cells[n];
      let v = activation(ctx, cl.t, cl.b, x.c, x.k, swapLeft);
      if (cl.tusk && swapLeft) v = Math.max(v, tuskGain(s, ctx));
      return v;
    }
  }

  function tuskGain(s, ctx) {
    const b = []; for (let n = 1; n < CELLS; n++) { const c = s.cells[n]; if (onBoard(c) && c.t < RAINBOW) b.push(c.t); }
    if (!b.length) return 0;
    const lift = b.reduce((a, t) => a + ctx.H[t + 1] - ctx.H[t], 0) / b.length;
    return Math.min(s.rules.tuskCount, b.length) * lift;
  }

  function devourScores(s, ctx) {
    const here = s.cells[s.pos];
    if (!onBoard(here) || s.used.dev >= 1) return [];
    const { c, k } = comp(s, s.pos);
    const own = preyLoss(s, ctx, s.pos, false);
    return devourOptions(s, s.pos).map((n) => {
      const m = s.cells[n];
      const scratch = m.s;
      const mealLoss = scratch ? 0 : preyLoss(s, ctx, n, true);
      return { cell: n, score: devourDelta(ctx, here.t, here.b, scratch ? 0 : m.b, scratch, c, k) - own - mealLoss };
    }).sort((a, b) => b.score - a.score);
  }

  function swapScore(s, ctx) {
    const here = s.cells[s.pos];
    if (!onBoard(here) || s.used.swap >= 1) return -Infinity;
    let g = swapGain(ctx, here.t) - preyLoss(s, ctx, s.pos, true) - ctx.P.swapMargin * ctx.openH;
    if (here.tusk) g += tuskGain(s, ctx);
    return g;
  }

  function boardH(s, ctx) {
    let v = s.vault * ctx.H[RAINBOW];
    for (let n = 1; n < CELLS; n++) { const c = s.cells[n]; if (onBoard(c)) v += ctx.H[c.t] * (devourOptions(s, n).length ? 1.25 : 1); }
    return v;
  }

  function pickGift(s, ctx, rnd) {
    let best = null, bv = -Infinity;
    for (const id of GIFT_IDS) {
      let tot = 0; const R2 = id === 'wine' ? 1 : 4;
      for (let i = 0; i < R2; i++) { const x = clone(s); x.pending = []; applyGift(x, id, rnd); tot += boardH(x, ctx); }
      const v = tot / R2;
      if (v > bv) { bv = v; best = id; }
    }
    return best;
  }

  // Score of taking instrument t next to the ones held: its own gain plus its measured synergy with each held one.
  function pairScore(s, t, P) {
    const one = P.single || {};
    let v = one[t] || 0;
    for (const h of s.toolList) { const k = h < t ? h + '|' + t : t + '|' + h; if (P.pair && P.pair[k] !== undefined) v += P.pair[k] - (one[h] || 0) - (one[t] || 0); }
    return v;
  }
  function pickByPairs(s, options, P) {
    if (!P.single) return null;
    let best = null, bv = -Infinity;
    for (const t of options) { const v = pairScore(s, t, P); if (v > bv) { bv = v; best = t; } }
    return best;
  }

  // The policy's next action for any phase: { type, cell?, id?, accept? }
  function decide(s, goal, P, rnd) {
    if (s.phase === 'ended') return null;
    const ctx = makeCtx(s, goal, P);
    if (s.pending.length) {
      const p = s.pending[0];
      if (p.kind === 'tool') {
        const best = pickByPairs(s, p.options, P) || P.toolRank.find((t) => p.options.includes(t)) || p.options[0];
        if (s.refreshes > 0 && P.toolRank.indexOf(best) >= (P.refreshBelow || 3)) return { type: 'refresh' };
        return { type: 'choose', id: best };
      }
      return { type: 'choose', id: pickGift(s, ctx, rnd) };
    }
    if (s.phase === 'patrol') return { type: 'patrol', cell: patrolScores(s, ctx)[0].cell };
    if (s.phase === 'event') {
      if (s.event.kind === 'chain') return { type: 'event', accept: true };
      const here = s.cells[s.event.cell];
      const { c } = comp(s, s.event.cell);
      return { type: 'event', accept: execValue(ctx, here.t, here.b, c) > P.execMargin * ctx.openH };
    }
    const dv = devourScores(s, ctx);
    const best = dv.length ? dv[0] : null;
    const sw = swapScore(s, ctx);
    if (best && best.score >= P.minDevour * ctx.openH) {
      if (sw > best.score && sw > 0) {
        // Swapping first is better only if the fresh inmate's expected devour + gain beats today's devour.
        const { c, k } = comp(s, s.pos);
        const fresh = swapGain(ctx, s.cells[s.pos].t) + freshAfterSwap(ctx, c, k);
        if (fresh > best.score) return { type: 'swap' };
      }
      return { type: 'devour', cell: best.cell };
    }
    if (sw > 0) return { type: 'swap' };
    return { type: 'end' };
  }
  function freshAfterSwap(ctx, c, k) {
    let sum = 0;
    for (let t = 0; t < 5; t++) { const p = ctx.sd[t]; if (!p) continue; for (let b = 0; b < 4; b++) sum += p / 4 * Math.max(0, bestMealValue(ctx, t, b, c, k)); }
    return sum;
  }

  function apply(s, a, rnd) {
    switch (a.type) {
      case 'choose': choose(s, a.id, rnd); break;
      case 'refresh': refreshOffer(s, rnd); break;
      case 'patrol': patrol(s, a.cell, rnd); break;
      case 'event': resolveEvent(s, a.accept, rnd); break;
      case 'devour': devour(s, a.cell, rnd); break;
      case 'swap': swap(s, rnd); break;
      case 'end': endDay(s, rnd); break;
    }
  }

  function playout(s, goal, P, rnd, cap) {
    let guard = 0;
    while (s.phase !== 'ended' && guard++ < (cap || 2000)) {
      const a = decide(s, goal, P, rnd);
      if (!a) break;
      apply(s, a, rnd);
    }
    return s;
  }

  // ---------- Candidates and the live check ----------
  function candidates(s, goal, P) {
    if (s.phase === 'ended') return [];
    if (s.pending.length) {
      const out = s.pending[0].options.map((id) => ({ type: 'choose', id }));
      if (s.pending[0].kind === 'tool' && s.refreshes > 0) out.push({ type: 'refresh' });
      return out;
    }
    if (s.phase === 'patrol') return s.dest.map((cell) => ({ type: 'patrol', cell }));
    if (s.phase === 'event') return [{ type: 'event', accept: true }, { type: 'event', accept: false }];
    const out = [];
    if (s.used.dev < 1) for (const n of devourOptions(s, s.pos)) out.push({ type: 'devour', cell: n });
    if (s.used.swap < 1 && onBoard(s.cells[s.pos])) out.push({ type: 'swap' });
    out.push({ type: 'end' });
    return out;
  }
  const sameAction = (a, b) => a && b && a.type === b.type && a.cell === b.cell && a.id === b.id && a.accept === b.accept;

  // Plays every candidate out `runs` times with common random numbers.
  // Returns per-candidate stats: mean utility, terminal value, rainbows, P(+1 Rainbow), quantiles.
  function liveCheck(s, opts) {
    const goal = goalOf(opts.goal);
    const P = Object.assign({}, BASE_PARAMS, opts.params || {});
    const runs = opts.runs || 300;
    const cands = opts.candidates || candidates(s, goal, P);
    const pickRnd = rng32(opts.seed || 12345);
    const policyPick = decide(clone(s), goal, P, pickRnd);
    const base = s.vault;
    const res = cands.map((a) => ({ action: a, u: [], v: [], rb: [], tiers: [0, 0, 0, 0, 0, 0] }));
    for (let r = 0; r < runs; r++) {
      for (let i = 0; i < cands.length; i++) {
        const rnd = rng32(((opts.seed || 12345) * 7919 + r * 104729) >>> 0);
        const x = clone(s); x._rnd = rnd;
        if (opts.seedExtra && x.rules.extraN && !x.extraQueue) {
          const later = x.rules.extraDays.filter((d) => d > x.day);
          const k = later.length ? pickW(rnd, x.rules.extraN) : 0;
          x.extraQueue = Array.from({ length: k }, () => later[(rnd() * later.length) | 0]).sort((p1, p2) => p1 - p2);
        }
        if (opts.seedEvents) for (let n = 1; n < CELLS; n++) { const c = x.cells[n]; if (c.s && c.fr && !c.ev && rnd() * 100 < x.rules.eventChance) c.ev = rnd() < 0.5 ? 'chain' : 'exec'; }
        apply(x, cands[i], rnd);
        playout(x, goal, P, rnd);
        res[i].u.push(utility(x, goal));
        res[i].v.push(terminalValue(x, goal));
        res[i].rb.push(x.vault - base);
        const tt = res[i].tiers; tt[5] += x.vault;
        for (let n = 1; n < CELLS; n++) { const c = x.cells[n]; if (onBoard(c)) tt[c.t]++; }
      }
    }
    return res.map((o) => {
      const n = o.u.length;
      const mean = o.u.reduce((a, b) => a + b, 0) / n;
      const vm = o.v.reduce((a, b) => a + b, 0) / n;
      const rbm = o.rb.reduce((a, b) => a + b, 0) / n;
      const sd = Math.sqrt(o.u.reduce((a, b) => a + (b - mean) * (b - mean), 0) / Math.max(1, n - 1));
      const sorted = o.v.slice().sort((a, b) => a - b);
      return {
        action: o.action, policy: sameAction(o.action, policyPick), mean, value: vm, se: sd / Math.sqrt(n), rainbows: rbm,
        pRainbow: o.rb.filter((x) => x >= 1).length / n, p2Rainbow: o.rb.filter((x) => x >= 2).length / n,
        q10: sorted[Math.floor(n * 0.1)], q50: sorted[Math.floor(n * 0.5)], q90: sorted[Math.min(n - 1, Math.floor(n * 0.9))],
        samples: o.u, tiers: o.tiers.map((t) => t / n), rbs: o.rb,
      };
    });
  }

  // ---------- Exact odds for the UI ----------
  // Final-tier distribution of a devour chain (no tools other than the ones held), exact by recursion.
  function chainDistribution(s, to) {
    const here = s.cells[s.pos], meal = s.cells[to];
    const ctxEats = [[L], [W], [R], [M]]; if (has(s, 'skewer')) ctxEats[R] = [M, R];
    const { c, k } = comp(s, s.pos);
    const scratch = meal.s;
    if (!scratch) c[meal.t * 4 + meal.b]--;
    const memo = new Map();
    const saw = has(s, 'saw'), muzzle = has(s, 'muzzle'), skewer = has(s, 'skewer');
    const add = (acc, d, w) => { for (let i = 0; i < 6; i++) acc[i] += w * d[i]; };
    function fromTier(t, kk) {
      if (t >= RAINBOW) { const d = [0, 0, 0, 0, 0, 0]; d[5] = 1; return d; }
      const acc = [0, 0, 0, 0, 0, 0];
      for (let b = 0; b < 4; b++) add(acc, eat(t, b, kk), 0.25);
      return acc;
    }
    function eat(t, b, kk) {
      let key = t * 4 + b + '|' + Math.min(kk, 4) + '|';
      for (let i = t * 4; i < 20; i++) key += String.fromCharCode(48 + c[i]);
      if (memo.has(key)) return memo.get(key);
      let tot = 0; for (const f of ctxEats[b]) tot += c[t * 4 + f];
      const acc = [0, 0, 0, 0, 0, 0];
      if (!tot) acc[t] = 1;
      else for (const f of ctxEats[b]) {
        const q = c[t * 4 + f]; if (!q) continue;
        c[t * 4 + f]--; add(acc, step(t, b, kk, 0), q / tot); c[t * 4 + f]++;
      }
      memo.set(key, acc);
      return acc;
    }
    function step(t, b, kk, extra) {
      let g = 1 + extra; if (muzzle && kk <= 3) g += 2; if (skewer && b === R) g += 1;
