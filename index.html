<script id="lab-src" type="text/plain">
// Background lab: plays whole runs under the player's calibrated rules. One job at a time:
// { id, rules, goal (V), params, tools, rewards, games } -> { id, mean, rainbows, pRb, p2Rb, value, inmates, tiers }.
// Game i always uses the same seed, so jobs that differ only in instruments are compared on identical prisons.
self.onmessage = function (e) {
  var j = e.data, C = self.TCore, goal = j.goal, n = j.games, acc = { u: 0, v: 0, rb: 0, p1: 0, p2: 0, inm: 0, tiers: [0, 0, 0, 0, 0, 0] };
  for (var i = 0; i < n; i++) {
    var rnd = C.rng32((0x5eed1ab + i * 104729) >>> 0);
    var st = C.newState({ rules: Object.assign({}, j.rules, { rewards: j.rewards }), tools: j.tools || [] });
    if (j.rewards && j.rules.extraN) {
      var later = j.rules.extraDays, k = C.pickW(rnd, j.rules.extraN), q = [];
      for (var x = 0; x < k; x++) q.push(later[(rnd() * later.length) | 0]);
      st.extraQueue = q.sort(function (a, b) { return a - b; });
    }
    C.startGame(st, rnd);
    var guard = 0;
    while (st.phase !== 'ended' && guard++ < 3000) { var a = C.decide(st, goal, j.params, rnd); if (!a) break; C.apply(st, a, rnd); }
    var t = [0, 0, 0, 0, 0, 0];
    for (var c = 1; c < 16; c++) if (C.onBoard(st.cells[c])) t[st.cells[c].t]++;
    t[5] += st.vault;
    acc.u += C.utility(st, goal); acc.v += C.terminalValue(st, goal); acc.rb += st.vault;
    if (st.vault >= 1) acc.p1++; if (st.vault >= 2) acc.p2++;
    for (var z = 0; z < 6; z++) acc.tiers[z] += t[z];
    acc.inm += t[0] + t[1] + t[2] + t[3] + t[4];
  }
  self.postMessage({ id: j.id, mean: acc.u / n, value: acc.v / n, rainbows: acc.rb / n, pRb: acc.p1 / n, p2Rb: acc.p2 / n, inmates: acc.inm / n, tiers: acc.tiers.map(function (x) { return +(x / n).toFixed(2); }) });
};
</script>
<script id="worker-src" type="text/plain">
var cur = 0;
self.onmessage = function (e) {
  var d = e.data; cur = d.id;
  var C = self.TCore, runs = 0, acc = d.cands.map(function () { return null; });
  // Past `max`, rollouts go on (up to `cap`) only while the measured leader beats the instant pick by 0.5–2 SE:
  // more samples settle whether the advice should change; a smaller gap is a tie and the pick stays.
  function settled(stats) {
    if (!(d.pick >= 0)) return true;
    var bi = 0; stats.forEach(function (x, i) { if (x.mean > stats[bi].mean) bi = i; });
    if (bi === d.pick) return true;
    var A = stats[bi].samples, B = stats[d.pick].samples, n = Math.min(A.length, B.length), m = 0, v = 0, i;
    for (i = 0; i < n; i++) m += A[i] - B[i];
    m /= n;
    for (i = 0; i < n; i++) v += (A[i] - B[i] - m) * (A[i] - B[i] - m);
    var se = Math.sqrt(v / Math.max(1, n - 1) / n);
    return m <= 0.5 * se || m > 2 * se;
  }
  function step() {
    if (cur !== d.id) return;
    var st = C.clone(d.state);
    var res = C.liveCheck(st, { goal: d.goal, params: d.params, runs: d.per, seed: 1000 + runs, candidates: d.cands, seedEvents: true, seedExtra: true });
    res.forEach(function (r, i) {
      var a = acc[i];
      if (!a) a = acc[i] = { action: r.action, policy: r.policy, u: [], rb: [], tiers: [0, 0, 0, 0, 0, 0], n: 0, vsum: 0 };
      Array.prototype.push.apply(a.u, r.samples); Array.prototype.push.apply(a.rb, r.rbs);
      a.n += r.samples.length; a.vsum += r.value * r.samples.length;
      r.tiers.forEach(function (x, k) { a.tiers[k] += x * r.samples.length; });
    });
    runs += d.per;
    var stats = acc.map(function (a) {
      var n = a.n, mean = a.u.reduce(function (x, y) { return x + y; }, 0) / n;
      var sd = Math.sqrt(a.u.reduce(function (x, y) { return x + (y - mean) * (y - mean); }, 0) / Math.max(1, n - 1));
      return { action: a.action, policy: a.policy, mean: mean, se: sd / Math.sqrt(n), value: a.vsum / n, samples: a.u.slice(), rbs: a.rb.slice(),
        pRainbow: a.rb.filter(function (x) { return x >= 1; }).length / n, p2Rainbow: a.rb.filter(function (x) { return x >= 2; }).length / n,
        rainbows: a.rb.reduce(function (x, y) { return x + y; }, 0) / n, tiers: a.tiers.map(function (x) { return x / n; }) };
    });
    var done = runs >= (d.cap || d.max) || (runs >= d.max && settled(stats));
    self.postMessage({ id: d.id, stats: stats, runs: runs, done: done });
    if (!done) setTimeout(step, 0);
  }
  step();
};
</script>

    S.analysis.stats = d.stats; S.analysis.runs = d.runs; S.analysis.done = d.done;
    refine();
    renderRail();
    if (d.done) { renderYard(); renderSide(); }
  }
  // Main-thread fallback: small batches between frames.
  function fallbackRun(a, st, cands) {
    let runs = 0; const acc = cands.map(() => null);
    const step = () => {
      if (!S.analysis || S.analysis.id !== a.id) return;
      const res = C.liveCheck(st, { goal: goalDef(), params: goalParams(), runs: 20, seed: 1000 + runs, candidates: cands, seedEvents: true, seedExtra: true });
      res.forEach((r, i) => { acc[i] = merge(acc[i], r); });
      runs += 20;
      a.stats = acc.map(finalize); a.runs = runs; a.done = runs >= 160;
      refine(); renderRail();
      if (!a.done) setTimeout(step, 16); else { renderYard(); renderSide(); }
    };
    setTimeout(step, 30);
  }
  function merge(a, r) {
    if (!a) return { action: r.action, policy: r.policy, u: r.samples.slice(), rb: r.rbs.slice(), v: [], tiers: r.tiers.map((x) => x * r.samples.length), n: r.samples.length, vsum: r.value * r.samples.length };
    a.u.push(...r.samples); a.rb.push(...r.rbs); a.n += r.samples.length; a.vsum += r.value * r.samples.length;
    r.tiers.forEach((x, i) => { a.tiers[i] += x * r.samples.length; });
    return a;
  }
  function finalize(a) {
    const n = a.n, mean = a.u.reduce((x, y) => x + y, 0) / n;
    const sd = Math.sqrt(a.u.reduce((x, y) => x + (y - mean) ** 2, 0) / Math.max(1, n - 1));
    return { action: a.action, policy: a.policy, mean, se: sd / Math.sqrt(n), value: a.vsum / n, samples: a.u, rbs: a.rb, pRainbow: a.rb.filter((x) => x >= 1).length / n, p2Rainbow: a.rb.filter((x) => x >= 2).length / n, rainbows: a.rb.reduce((x, y) => x + y, 0) / n, tiers: a.tiers.map((x) => x / n) };
  }

  // ---------- Run lifecycle ----------
  // Only a finished run (recordRun) adds to the statistics; an abandoned one is dropped with its counts.
  function newRun(opts) {
    const pi = petInfo();
    const s = C.newState({ rules: calibratedRules(), refreshes: pi.refresh >= 1 ? 1 : 0 });
    s._rnd = rng;
    s.dest = [];
    S.run = { s, step: 'doors', sub: {}, undo: [], picks: [], gamble: null, log: [], mid: !!(opts && opts.mid), stage: S.settings.stage };
    yardKey = '';
    if (opts && opts.mid) { S.run.step = 'edit'; S.run.sub = { back: 'doors', intro: true, introStep: 0 }; }
    S.screen = 'play';
    persist(); render(); analyze();
  }
  function snapshot() {
    const r = S.run;
    r.undo.push(JSON.stringify({ s: strip(r.s), step: r.step, sub: r.sub, picks: r.picks, gamble: r.gamble, cal: r.cal || null }));
    if (r.undo.length > 60) r.undo.shift();
  }
  function undo() {
    const r = S.run; if (!r || !r.undo.length) return;
    const o = JSON.parse(r.undo.pop());
    r.s = o.s; r.s._rnd = rng; r.step = o.step; r.sub = o.sub; r.picks = o.picks; r.gamble = o.gamble; r.cal = o.cal;
    S.analysis = null; jobId++;
    persist(); render(); analyze();
    toast('Шаг отменён', 'undo', 1400);
  }
  function go(step, sub) { S.run.step = step; S.run.sub = sub || {}; S.analysis = null; jobId++; persist(); render(); analyze(); }
  const st = () => S.run.s;

  // ---------- Analysis ----------
  function analysisState() {
    const r = S.run, s = applyCalib(C.clone(st())); s._rnd = rng;
    if (r.step === 'go') { s.phase = 'patrol'; s.pending = []; return s; }
    if (r.step === 'event') { s.phase = 'event'; s.pending = []; return s; }
    if (r.step === 'act') { s.phase = 'manage'; s.pending = []; s.event = null; return s; }
    if (r.step === 'gift') { s.phase = 'manage'; return s; }
    if (r.step === 'tool' && r.sub.offer && r.sub.offer.length === 3) {
      s.phase = 'manage'; s.event = null;
      s.pending = [{ kind: 'tool', options: r.sub.offer.slice() }].concat(s.pending.filter((p) => p.kind !== 'tool'));
      s.refreshes = r.sub.refreshAvail ? Math.max(1, s.refreshes) : 0;
      return s;
    }
    return null;
  }
  function analyze() {
    jobId++;
    S.analysis = null;
    if (!S.run || S.screen !== 'play') { renderRail(); return; }
    const s = analysisState();
    if (!s || s.phase === 'ended') { renderRail(); return; }
    const goal = goalDef(), P = goalParams();
    const cands = C.candidates(s, goal, P);
    if (!cands.length) { renderRail(); return; }
    const pick = C.decide(C.clone(s), goal, P, C.rng32(7));
    const a = { id: jobId, step: S.run.step, cands, pick, rec: pick, stats: null, runs: 0, done: false, refined: false };
    S.analysis = a;
    renderRail(); renderYard(); renderBoard(); renderSide();
    if (cands.length < 2) { a.done = true; return; }
    const plain = JSON.parse(JSON.stringify(strip(s)));
    const max = S.run.step === 'go' ? 480 : 400;
    if (worker) worker.postMessage({ id: a.id, state: plain, goal, params: P, cands, per: 40, max, cap: 3 * max, pick: cands.findIndex((c) => C.sameAction(c, pick)) });
    else fallbackRun(a, s, cands);
  }
  function pairedGap(A, B) {
    const n = Math.min(A.length, B.length);
    let m = 0; for (let i = 0; i < n; i++) m += A[i] - B[i]; m /= n;
    let v = 0; for (let i = 0; i < n; i++) v += (A[i] - B[i] - m) ** 2;
    return { m, se: Math.sqrt(v / Math.max(1, n - 1) / n) };
  }
  // The instant pick is a heuristic; the rollouts measure. Only a clear gap (2 SE) overrides the pick: a smaller one
  // is a tie the rail already shows as "≈", and the worker keeps sampling while the gap is between 0.5 and 2 SE.
  function refine() {
    const a = S.analysis; if (!a || !a.stats || a.runs < 120) return;
    const iPick = a.stats.findIndex((x) => C.sameAction(x.action, a.pick));
    let bi = 0; a.stats.forEach((x, i) => { if (x.mean > a.stats[bi].mean) bi = i; });
    const before = a.rec;
    if (iPick < 0 || bi === iPick) a.rec = a.pick;
    else {
      const g = pairedGap(a.stats[bi].samples, a.stats[iPick].samples);
      a.rec = g.m > 2 * g.se ? a.stats[bi].action : a.pick;
    }
    a.refined = !C.sameAction(a.rec, a.pick);
    if (!C.sameAction(before, a.rec)) { renderYard(); renderBoard(); renderSide(); }
  }
  // A Rainbow is worth more than its chest: a Warden's Cache gift and the tail of rare drops. JACKPOT is that premium
  // as a share of the chest's own worth; a riskier move is offered when its expected loss is under the premium bought.
  const JACKPOT = 0.5;
  function gambleOf() {
    const a = S.analysis; if (!a || !a.stats || a.runs < 120) return null;
    const best = a.stats.find((x) => C.sameAction(x.action, a.rec)); if (!best) return null;
    const goal = goalDef(), unit = goal.V[5];
    let g = null;
    for (const x of a.stats) {
      if (x === best || x.action.type === 'end') continue;
      const n = Math.min(x.rbs.length, best.rbs.length);
      const lift = x.pRainbow - best.pRainbow;
      const seLift = Math.sqrt((x.pRainbow * (1 - x.pRainbow) + best.pRainbow * (1 - best.pRainbow)) / Math.max(1, n));
      const cost = best.mean - x.mean;
      const paid = JACKPOT * unit * lift;
      if (lift >= 0.03 && lift > 2 * seLift && x.pRainbow >= 0.05 && cost <= paid && (!g || lift > g.lift)) g = { x, best, lift, cost, unit };
    }
    return g;
  }

  // ---------- Labels ----------

      case 'devour': { const c = s.cells[a.cell]; return `Съесть ${pad(a.cell)}${short || c.s ? '' : ` · ${BEASTS[c.b].n}`}`; }

  // ---------- Exact odds helpers ----------
  const calView = (s) => ({ rules: Object.assign({}, s.rules, calibratedRules()), tools: s.tools });

  function mealChance(s, dist, exclude) {

      let fed = 0;
      for (let b = 0; b < 4; b++) if (s.cells.some((c, n) => n !== exclude && C.onBoard(c) && C.canEat(s, b, t, c.b, c.t))) fed++;

        <div class="seg">${COMPASS.map((c) => `<div class="segi ${set.compass === c.id ? 'on' : ''}"><button data-compass="${c.id}"><b>${c.n}</b><span>${c.d}</span></button>${c.id === 'none' ? '' : priceIn(c)}</div>`).join('')}</div>
        <div id="verdict">${compassVerdict()}</div>

        <aside class="mnote right">Петы и компас умножают добычу всех сундуков одинаково, поэтому стратегию от них менять не нужно.</aside></section>

  // Loot from riot chests without any compass, per run, from the player's own log: fe / (1 + q).
  function baseLoot(stage) {
    const rows = (S.settings.history || []).filter((x) => x.fe > 0 && !x.lucky && (!stage || x.stage === stage));
    if (!rows.length) return null;
    const q = (id) => (COMPASS.find((c) => c.id === id) || COMPASS[0]).q;
    return { n: rows.length, mean: rows.reduce((a, x) => a + x.fe / (1 + q(x.compass || 'none')), 0) / rows.length };
  }
  // Mean logged loot of runs with this compass on this stage, so the verdict can use what really dropped
  // (a too-tough riot loses chests) instead of the card's +X%.
  function seenLoot(stage, compass) {
    const rows = (S.settings.history || []).filter((x) => x.fe > 0 && !x.lucky && x.stage === stage && (x.compass || 'none') === compass);
    return rows.length >= 3 ? { n: rows.length, mean: rows.reduce((a, x) => a + x.fe, 0) / rows.length } : null;
  }
  function compassVerdict() {
    const set = S.settings, base = baseLoot(set.stage), plain = seenLoot(set.stage, 'none');
    const lines = COMPASS.filter((c) => c.id !== 'none').map((c) => {
      const price = +set.compassPrice[c.id] || 0;
      if (!price) return '';
      const with_ = seenLoot(set.stage, c.id);
      let body;
      if (plain && with_) {
        const net = with_.mean - price - plain.mean;
        body = `по вашим забегам: без компаса <b class="num">${fmt(plain.mean, 0)} FE</b>, с ним <b class="num">${fmt(with_.mean, 0)} − ${fmt(price, 0)} = ${fmt(with_.mean - price, 0)} FE</b>. ${net >= 0 ? `Выгоднее с компасом: +${fmt(net, 0)} FE за забег.` : `Выгоднее без компаса: +${fmt(-net, 0)} FE за забег.`}`;
      } else if (base) {
        const withQ = base.mean * (1 + c.q), net = withQ - price - base.mean;
        body = `оценка: без компаса около <b class="num">${fmt(base.mean, 0)} FE</b> за забег, с ним <b class="num">${fmt(withQ, 0)} − ${fmt(price, 0)} = ${fmt(withQ - price, 0)} FE</b>. ${net >= 0 ? `Выгоднее с компасом: +${fmt(net, 0)} FE.` : `Выгоднее без компаса: +${fmt(-net, 0)} FE.`} ${q(`Добыча без компаса здесь пересчитана из ваших ${base.n} ${plural(base.n, 'забега', 'забегов', 'забегов')} на ${set.stage} делением на бонус компаса. Это приблизительно: Mercury и Redgold ещё и делают бунт тяжелее. После 3 забегов с этим компасом и 3 без него помощник сравнит то, что выпало на самом деле.`)}`;
      } else body = `выгоден, если сундуки бунта без компаса дают больше <b class="num">${fmt(price / c.q, 0)} FE</b> за забег (цена / ${pct(c.q)}).`;
      return `<li><b>${c.n}</b>: ${body}</li>`;
    }).filter(Boolean);
    if (!lines.length) return '<p class="note">Введите цену компаса, и помощник посчитает, окупается ли он. Пока у вас мало забегов, это оценка по +% к добыче. После 3 забегов с компасом и 3 без него на этом этапе он сравнит то, что у вас выпало на самом деле.</p>';
    return `<ul class="verdict">${lines.join('')}</ul>`;
  }
  // FE a chest of each rarity brings at ×1 loot, fitted to the player's logged runs (FE / loot multiplier).
  // Model: chest of rarity t (below Chromatic) is worth a·r^t, a Chromatic chest is worth c. Three numbers instead of six,
  // so a dozen runs already separate "many cheap chests" from "a few rare ones" across runs of different make-up.
  // r is searched on a grid with a mild pull toward 2 (fades as runs accumulate); c falls back to 1.5·a·r^5 while
  // fewer than 3 Chromatic chests were logged.
  const FIT_MIN = 10;
  function chestValues() {

  // ---------- Analysis rail ----------
  // Patches the live DOM toward new markup instead of replacing it: bars glide to their new width, hovered rows
  // keep their tooltip, and nothing blinks while rollouts stream in.
  function morph(from, to) {
    if (from.nodeType !== to.nodeType || from.nodeName !== to.nodeName) { from.replaceWith(to.cloneNode(true)); return; }
    if (from.nodeType === 3) { if (from.nodeValue !== to.nodeValue) from.nodeValue = to.nodeValue; return; }
    if (from.nodeType !== 1) return;
    for (const a of Array.from(from.attributes)) if (!to.hasAttribute(a.name)) from.removeAttribute(a.name);
    for (const a of Array.from(to.attributes)) if (from.getAttribute(a.name) !== a.value) from.setAttribute(a.name, a.value);
    const fc = Array.from(from.childNodes), tc = Array.from(to.childNodes);
    for (let i = 0; i < tc.length; i++) { if (i < fc.length) morph(fc[i], tc[i]); else from.appendChild(tc[i].cloneNode(true)); }
    for (let i = tc.length; i < fc.length; i++) fc[i].remove();
  }
  function morphHtml(el, html) {
    const t = document.createElement(el.tagName); t.innerHTML = html;
    const fc = Array.from(el.childNodes), tc = Array.from(t.childNodes);
    for (let i = 0; i < tc.length; i++) { if (i < fc.length) morph(fc[i], tc[i]); else el.appendChild(tc[i].cloneNode(true)); }
    for (let i = tc.length; i < fc.length; i++) fc[i].remove();
  }
  let oddsKey = '';
  function renderRail() {
    const el = $('#rail'); if (!el) return;
    if (!S.run || S.screen !== 'play') { el.innerHTML = ''; return; }
    const s = S.run.s, a = S.analysis;
    let move = '';
    if (a && a.cands.length > 1) {
      const stats = a.stats;
      const rows = a.cands.map((c, i) => ({ c, x: stats ? stats[i] : null, best: C.sameAction(c, a.rec) }));
      const unit = unitName(), rbUnit = S.settings.goal === 'rainbow', dg = rbUnit ? 2 : 1;
      const bestStat = stats ? stats.find((x) => C.sameAction(x.action, a.rec)) : null;
      const gaps = rows.map(({ x }) => (x && bestStat && x !== bestStat ? pairedGap(bestStat.samples, x.samples) : { m: 0, se: 0 }));
      const norm = Math.max(1e-9, ...gaps.map((g) => Math.max(0, g.m)), ...gaps.map((g) => 3 * g.se));
      const ordered = rows.map((row, i) => Object.assign({}, row, { gap: gaps[i] })).sort((p, q2) => (q2.best - p.best) || (p.gap.m - q2.gap.m));
      const rowsHtml = ordered.map(({ c, x, best, gap }) => {
        const sig = gap.m > 2 * gap.se;
        const w = !x ? 40 : best ? 100 : Math.max(12, 100 - 70 * Math.max(0, gap.m) / norm);
        const val = !x ? '…' : best ? 'лучший' : sig ? `−${fmt(gap.m, dg)}` : '≈';
        const total = x ? (rbUnit ? `${fmt(x.rainbows + s.vault, 2)} радуги` : `${fmt(x.value, 1)} очка ценности`) : '';
        const tipText = !x ? 'Считаю…' : best
          ? `Рекомендуемый ход. К концу забега в среднем ${total}, шанс новой радуги ${pct(x.pRainbow)}.`
          : sig ? `Хуже рекомендуемого в среднем на ${fmt(gap.m, dg)} ${unit}. К концу забега ${total}, новая радуга ${pct(x.pRainbow)}.`
            : `Почти так же хорошо: разница ${fmt(Math.abs(gap.m), dg)} ± ${fmt(2 * gap.se, dg)} в пределах случайности, можно выбрать и его. К концу забега ${total}, новая радуга ${pct(x.pRainbow)}.`;
        return `<div class="row ${best ? 'best' : ''}" data-hl="${c.cell === undefined ? '' : c.cell}" data-tip="${tipText}"><div class="rname">${ico(actionIcon(c))}<span>${actionLabel(c)}</span></div><div class="rv num">${val}</div><div class="track"><i style="width:${w}%"></i></div></div>`;
      }).join('');
      const g = gambleOf();
      const gamble = g ? `<div class="gamble"><span class="gi">${ico('dice')}</span><b>Ставка на радугу: ${actionLabel(g.x.action)}</b><p>Шанс новой радуги ${pct(g.x.pRainbow)} против ${pct(g.best.pRainbow)}${g.x.pRainbow < 0.5 ? ` (≈1 из ${Math.max(2, Math.round(1 / g.x.pRainbow))})` : ''}. ${g.cost > 0.005 * Math.abs(g.best.mean) ? `Цена: в среднем −${fmt(g.cost, dg)} ${unit}.` : 'В среднем почти без потерь.'} ${q('Радуга стоит больше своего сундука: она открывает дар хранилища и даёт шанс на редкий дроп. Ставка показывается, только когда её цена меньше половины этой надбавки, поэтому на дистанции она окупается. Берите её, если готовы к разбросу.')}</p></div>` : '';
      const status = a.done ? `<span class="status">${a.runs} прогонов</span>` : `<span class="status"><i class="spin"></i>${stats ? a.runs : 'считаю'}</span>`;
      move = `<section><h4>${ico('target')}<span class="grow">Варианты хода</span>${status}</h4><div class="rows">${rowsHtml}</div>${a.refined ? '<div class="note">Прогоны поправили быструю оценку: этот ход лучше.</div>' : ''}${gamble}</section>`;
    } else if (a && a.cands.length === 1) {
      move = `<section><h4>${ico('target')}<span class="grow">Ход</span></h4><div class="muted">Вариант один: ${actionLabel(a.cands[0])}.</div></section>`;
    }
    const odds = oddsSection();
    morphHtml(el, move + odds + forecastSection());
    countUp(el);
    // The dice rolls once when the odds change, not on every rollout batch.
    const k = odds.replace(/\s+/g, '');
    if (k !== oddsKey) { oddsKey = k; const d = el.querySelector('.dicei'); if (d) { d.classList.remove('roll'); void d.getBBox(); d.classList.add('roll'); } }
  }
  // Numbers roll from their previous value so the eye catches what changed.
  const lastCount = {};
  function countUp(root) {
    root.querySelectorAll('[data-count]').forEach((el) => {
      const key = el.dataset.count, d = +el.dataset.d;
      const to = parseFloat(el.dataset.v);
      const from = lastCount[key];
      lastCount[key] = to;
      if (from === undefined || Math.abs(from - to) < 1e-9 || window.matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = fmt(to, d); return; }
      const t0 = performance.now(), dur = 420;
      const tick = (now) => {
        const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        if (!el.isConnected || +el.dataset.v !== to) return;
        el.textContent = fmt(from + (to - from) * e, d);
        if (k < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }
  function oddsSection() {
    const r = S.run, s = r.s, step = r.step;

      if (step === 'go') {

      }
    } else if (step === 'act') {

    } else if (step === 'event' && s.event) {
      body = s.event.kind === 'chain' ? '<div class="note">Все закрытые клетки на пути к следующей цели откроются. Обычно это 1–4 новых узника.</div>' : '<div class="note">Казнь убирает узников, которых ест палач, ниже его редкости. Палач растёт на ранг за каждого.</div>';
    } else if (step === 'tool') {
      const left = 13 - s.toolList.length, ref = r.sub.refreshAvail;
      body = `<div class="odd"><div class="ot"><span>В предложении есть один из 3 лучших для вас ${q('Лучшие — по рангу инструментов для вашей стратегии. Строка с обновлением видна, только если оно есть: его даёт Twin Inquisitors со 2 ранга.')}</span><b class="num">${pct(C.toolOfferOdds(left, 3, 0))}</b></div>${ref ? `<div class="legend"><span>с обновлением <b class="num">&nbsp;${pct(C.toolOfferOdds(left, 3, 1))}</b></span></div>` : ''}</div>`;
    }
    if (!body) return '';
    return `<section><h4><svg class="i dicei" viewBox="0 0 24 24" aria-hidden="true">${ICONS.dice}</svg><span class="grow">Шансы</span></h4><div class="odds">${body}</div></section>`;
  }
  function forecastSection() {
    const a = S.analysis, s = st();
    const best = a && a.stats ? a.stats.find((x) => C.sameAction(x.action, a.rec)) : null;
    const counts = [0, 0, 0, 0, 0, 0]; s.cells.forEach((c) => { if (C.onBoard(c)) counts[c.t]++; }); counts[5] += s.vault;

  }

  // ---------- Side panel: why this move, instruments, vault ----------
  // Tier letter from the measured gain of holding the instrument from day 1, relative to the best one for this goal.
  function toolTier(id) {
    const g = S.settings.goal === 'custom' || S.settings.goal === 'mine' ? 'value' : S.settings.goal;
    const d = (LAB.toolDelta || {})[g] || {};
    const max = Math.max(1e-9, ...Object.values(d));
    const r = (d[id] || 0) / max;
    return r >= 0.75 ? 'S' : r >= 0.45 ? 'A' : r >= 0.2 ? 'B' : r >= 0.05 ? 'C' : 'D';
  }
  const tierBadge = (id) => { const t = toolTier(id); return `<span class="tier t-${t}" aria-label="Ранг ${t}">${t}</span>`; };
  const toolTip = (t, extra) => `<b>${TOOLS[t].n}</b> · ранг ${toolTier(t)}<br>${TOOLS[t].d}<br><span class='tt-how'>${TOOLS[t].how}</span>${extra || ''}`;
  let sideHtml = '';
  function renderSide() {

      : s.toolList.length
        ? `<ul class="tlist">${s.toolList.map((t) => `<li data-tip="${toolTip(t)}">${ico(t)}<span>${TOOLS[t].n}</span>${tierBadge(t)}</li>`).join('')}</ul>`
        : '<p class="muted">Пока нет. Первый Высший узник даст выбор из трёх.</p>';
    const canOffer = !editing && ['doors', 'go', 'act'].includes(S.run.step);

  // A short overlay on the board: rainbow streaks burst from the centre for a win, a calm card for a loss.
  // Never blocks input, removes itself, and is skipped under reduced motion (a toast says the same).
  const FX_COLORS = ['#ff6b6b', '#ffb14a', '#f4e35a', '#6be38d', '#59b8ff', '#a77bff'];
  function celebrate(kind, title, text, ms) {
    const stage = $('#board'); if (!stage) return;

  function startSwap() {

  function onCell(n) {

  // The log lives in this browser; a file copy survives cleared site data and moves between machines.

  function importData() {

    inp.onchange = () => {

        if (!o || o.app !== 'tartarus-copilot' || !Array.isArray(o.history)) { toast('Это не файл статистики помощника.', 'close'); return; }

  const WIKI = [

  const WIKI_BODY = {

      <h3>Один день</h3><ul>
      <li><b>Утро.</b> Игра подсвечивает три двери — нажмите их на доске. Помощник покажет, куда идти, и нарисует путь. Если на двери знак «!», отметьте его до выбора: такая дверь ценнее.</li>

      <h3>Свой ход</h3><p>Советы не обязательны. Нажмите любую светящуюся дверь или другое действие: помощник примет ваш выбор и пересчитает дальше. Знак <b>≈</b> справа значит, что вариант почти так же хорош, как лучший.</p>
      <h3>Начать с середины забега</h3><p>На главном экране нажмите «Ввести доску с середины забега»: помощник по очереди спросит день, расстановку на доске, инструменты и радуги в хранилище. Поправить доску позже можно кнопкой «Править доску». Сундуки вводить не нужно: на бунте каждый узник сам становится сундуком своей редкости.</p><p>В статистику забег попадает только после бунта. Брошенный забег не учитывается, а забег, начатый с середины, не считается в «сколько инструментов за забег»: часть инструментов была взята до ввода.</p>
      <h3>Если ошиблись</h3><ul><li><b>Отменить</b> под доской возвращает шаг назад (или Ctrl+Z).</li><li><b>Править доску</b> меняет любую клетку, день, надзирателя, инструменты и хранилище.</li><li>Забег сохраняется в этом браузере. Закрыли вкладку — откройте снова, доска на месте.</li></ul>
      <h3>После бунта</h3><p>Запишите добычу из сундуков в FE. Это необязательно, но так появятся средняя добыча по этапам и честный ответ, окупается ли компас. Сверхредкий дроп отметьте отдельно: забег сохранится, но не исказит средние. Настройки петов и компаса — кнопка «Настройки» вверху, доска при этом не теряется.</p>
      <h3>Ставка на радугу</h3><p>Иногда справа появляется рискованный вариант: он поднимает шанс радуги ценой небольшой потери в среднем. Помощник предлагает его, только когда ставка окупается на дистанции за счёт дара хранилища и шанса на редкий дроп. Выиграли — порадуемся вместе, проиграли — план всё ещё на месте.</p>`,
    rules: () => `<h2>Правила за минуту</h2><p class="lead">Фаза надзирателя длится 20 дней. Потом узники поднимают бунт, и каждый побеждённый открывает сундук своей редкости. Задача — вырастить к бунту как можно более ценных узников.</p>
      <h3>Кольцо</h3><p>16 клеток по кругу, 01 — офис надзирателя, в нём никто не сидит. Каждое утро игра подсвечивает 3 клетки из 5 ближайших по часовой стрелке. Офис считается шагом, но его не предлагают, поэтому рядом с ним выбор идёт из 4 клеток.</p>
      <h3>Кто кого ест</h3><div class="loop">${beastChip(0)}<span class="ar">ест</span>${beastChip(1)}<span class="ar">ест</span>${beastChip(2)}<span class="ar">ест</span>${beastChip(3)}<span class="ar">ест</span>${beastChip(0)}</div>
      <p>Есть можно только узника <b>той же редкости</b>, и начать укус может только узник под надзирателем. После укуса он поднимается на ранг и <b>случайно меняет вид</b> — так в игре, это сказано в официальном анонсе сезона. Если новому виду есть кого съесть на новой редкости, цепочка продолжается сама, остановить её нельзя.</p>
      <p>Чем больше разных зверей стоит на одной редкости, тем дальше идёт цепочка. Если там все четыре вида, она точно не оборвётся.</p>
      <h3>Один раз в день</h3><ul><li><b>Съесть</b>: только узником под надзирателем.</li><li><b>Заменить</b>: узник под надзирателем уходит, на его место приходит случайный новый.</li></ul>
      <h3>Редкости</h3><p>${[0, 1, 2, 3, 4, 5].map(tierName).join(' → ')}. ${tierName(5)} узник сразу уходит в хранилище и открывает дар. Первый Высший за забег даёт выбор инструмента.</p>
      <h3>События и метки</h3><ul><li><b>Знак «!» на двери</b>: за ней событие тюрьмы. <b>Цепная реакция</b> — следующий патруль откроет все закрытые двери по пути. <b>Казнь</b> — палач убирает тех, кого ест, ниже своей редкости, и растёт на ранг за каждого.</li><li>${MARKS.tusk}</li><li>${MARKS.prey} Похоже, это метка, а не соседство: на единственной известной доске лев и его добыча стояли далеко друг от друга (доска собрана до старта лиги, так что это ещё проверить). Как метка появляется, пока не известно; увидели её утром — нажмите «Утром появилась метка добычи?».</li><li>${MARKS.scratch}</li><li>${MARKS.nest}</li></ul>
      <p class="note">Шансы за дверью и частота событий в игре официально не опубликованы. Помощник начинает с оценки и уточняет её по вашим забегам — см. «Ваша статистика».</p>`,
    goals: () => `<h2>Стратегии</h2><p class="lead">Стратегия — это то, насколько вам ценен сундук каждой редкости. От неё зависит, когда есть, а когда копить.</p>
      <h3>Главное правило</h3><p>Укус превращает двух узников в одного на ранг выше. Если сундук следующей редкости стоит <b>больше двух</b> текущих, есть выгодно. Если меньше — выгоднее копить количество.</p>
      <div class="tbl-wrap"><table class="wt"><tr><th>Стратегия</th><th>Кому</th><th class="r">Радужных</th><th class="r">Всего сундуков</th><th class="r">Хотя бы 1 радуга</th></tr>${GOALS.filter((g) => g.id !== 'custom').map((g) => { const x = (LAB.goalStats || {})[g.id]; return `<tr><td>${g.n}</td><td>${g.who}</td><td class="r num">${x ? fmt(x.rainbows, 2) : '—'}</td><td class="r num">${x ? fmt(x.inmates + x.rainbows, 1) : '—'}</td><td class="r num">${x ? pct(x.pRb) : '—'}</td></tr>`; }).join('')}</table></div>
      <p class="note">Средние за 20-дневный забег: инструменты по вашим данным, дар за каждую радугу, без петов. ${S.settings.labCache ? 'Пересчитано по вашим шансам.' : `Заводская оценка: событие «!» за ${LAB.eventChance || 10}% дверей, ${LAB.games ? `${(LAB.games / 1000).toFixed(0)} тыс. забегов на стратегию` : ''}.`}</p>
      ${GOALS.map((g) => `<h3>${g.n}</h3><p>${g.d}</p>`).join('')}
      <h3>Что такое «очко ценности»</h3><p>Так «Растить всех» сравнивает ходы: Обычный сундук — 1 очко, Магический — 2, Редкий — 4, Легендарный — 8, Высший — 16, радужный — 48. Каждый ранг вдвое дороже предыдущего, а радуга втрое дороже Высшего, потому что даёт ещё и дар. Это модель для сравнения ходов, а не цена в FE.</p>
      <h3>Петы и компас не меняют стратегию</h3><p>Они умножают добычу всех сундуков одинаково, поэтому лучший ход от них не зависит. Исключение одно — обновление инструментов у Twin Inquisitors с ранга 2: оно учтено автоматически.</p>`,
    tools: () => {
      const g = S.settings.goal === 'custom' || S.settings.goal === 'mine' ? 'value' : S.settings.goal;
      const rank = goalParams().toolRank;
      const d = ((LAB.toolDelta || {})[g]) || {};
      return `<h2>Инструменты</h2><p class="lead">Первый Высший узник за забег даёт выбор из трёх инструментов. Инструмент действует до конца забега, поэтому ранний сильный инструмент стоит очень много.</p>
      <h3>Ранги для стратегии «${GOALS.find((x) => x.id === S.settings.goal).n}»</h3><p>Прирост — насколько вырастает итог забега, если держать инструмент с первого дня, против забега без инструментов и даров. Ранг S у лучших инструментов, D — почти бесполезные.</p>
      <div class="tbl-wrap"><table class="wt"><tr><th></th><th>Инструмент</th><th>Что делает</th><th class="r">Прирост</th></tr>${rank.map((t) => `<tr><td>${tierBadge(t)}</td><td>${TOOLS[t].n}</td><td>${TOOLS[t].d}</td><td class="r num">${d[t] !== undefined ? signed(d[t]) : ''}</td></tr>`).join('')}</table></div>
      <h3>Как играть с каждым</h3><ul>${rank.map((t) => `<li><b>${TOOLS[t].n}</b>. ${TOOLS[t].how}</li>`).join('')}</ul>
      <h3>Связки</h3><ul>
      <li><b>Iron Tongs of Lust + Hangman's Noose</b>: замена клетки с бивнем даёт +4 ранга доске и Редкого или Легендарного новичка вместо мамонта.</li>
      <li><b>Skewered Rat Heads + Squirming Iron Box</b>: гнёзда приносят Редких крыс, а крысы едят друг друга с +2 за укус.</li>
      <li><b>Avenger's Casket + Rusty Saw</b>: обе срабатывают на каждом укусе, поэтому длинные цепочки становятся ещё длиннее.</li>
      <li><b>Fanged Guillotine + крысы</b>: волки подъедают мелких крыс любой редкости ниже своей.</li>
      <li><b>Raging Beast's Agonizing Muzzle</b> лучше взять рано: пока на доске 3 узника или меньше, один укус даёт +3 ранга.</li></ul>
      <h3>Выбор на вашей доске</h3><p>Ранг — это среднее по многим забегам. Когда вы отметили три предложенных инструмента, помощник доигрывает забег с каждым из них сотни раз <b>с вашей текущей доски</b>. Поэтому инструмент ниже рангом может оказаться лучшим: Iron Tongs of Lust при нескольких мамонтах, Skewered Rat Heads при парах крыс, Agonizing Muzzle на почти пустой доске.</p>
      <h3>Сколько инструментов за забег</h3><p>Первый даёт цель «King of the Caged» — первый Высший за забег. На досках, собранных до старта лиги, встречались забеги с двумя инструментами, но это могли быть тестовые вводы, а откуда приходят следующие, не опубликовано. Помощник не фиксирует их число: он предполагает от 1 до 6 за забег (чаще 2–3) и уточняет это по вашим забегам — сколько инструментов вы взяли и в какие дни. Когда игра предлагает инструмент не за Высшего, нажмите «Игра предложила инструмент» в панели слева.</p>
      <h3>Как помощник собирает связки</h3><p>Выбирая инструмент, он доигрывает забег с каждым из трёх, и в этих прогонах игра может предложить ещё инструменты — с той частотой, что видна по вашим забегам. Следующий инструмент в прогонах берётся по измеренной силе пары с уже взятыми. Поэтому инструмент, который сам по себе слабее, но с высокой вероятностью соберёт сильную пару, может оказаться лучшим выбором. Под советом видно, с чем выбранный инструмент даёт связку и какой вариант стабильнее.</p>
      ${pairsTable()}
      <h3>Обновление предложения</h3><p>Twin Inquisitors с ранга 2 дают обновление инструментов с шансом 50%, с ранга 4 — всегда. Обновление тоже сравнивается прогонами: помощник советует его, если новое случайное предложение в среднем лучше лучшего из трёх.</p>
      <h3>Дары хранилища (за каждую радугу)</h3><ul>${C.GIFT_IDS.map((x) => `<li><b>${GIFTS[x].n}</b>: ${GIFTS[x].d}</li>`).join('')}</ul><p>Дары можно брать повторно. Помощник сравнивает все четыре прогонами по текущей доске, поэтому на разных досках советует разное.</p>
      <p class="note">Список инструментов взят из симулятора и проверен по анонсам. Привязка инструментов к этапу (T7–Deep Space) не опубликована. Если игра предложит инструмент, которого здесь нет, напишите о нём: помощник его пока не знает.</p>`;
    },
    pets: () => {
      const row = (id, r) => `<tr><td>${r}</td><td>${petText(id, r)}</td><td class="r num">×${fmt(petParts(id, r).mult, 2)}</td></tr>`;
      const table = (id) => `<div class="tbl-wrap"><table class="wt"><tr><th>Ранг</th><th>Эффект</th><th class="r">Добыча</th></tr>${[1, 2, 3, 4, 5, 6].map((r) => row(id, r)).join('')}</table></div>`;
      return `<h2>Петы и компасы</h2><p class="lead">Они увеличивают добычу из сундуков, но почти не меняют саму мини-игру. «Добыча ×1,30» значит: из каждого сундука в среднем на 30% больше предметов.</p>
      <h3>Twin Inquisitors (легендарный)</h3>${table('twin')}
      <p>Самые заметные ранги — <b>1</b> (копия предметов 18%), <b>4</b> (обновление инструментов каждый забег) и <b>6</b> (копия 28%). Эффект ранга не складывается с прошлым, а заменяет его: на ранге 6 копия 28%, а не 18% + 28%.</p>
      <h3>Heartbloom · Iris (редкий)</h3>${table('iris')}
      <h3>Ripplepop · Taro (магический)</h3>${table('taro')}
      <p class="note">Множитель включает малые узлы пакта: питомцы этой механики открывают их сразу (Twin +12%, Iris +11%, Taro +5% к количеству добычи из сундуков). У Iris и Taro на ранге 1 tlidb не показывает число прибавки к количеству; принято как на ранге 2.</p>
      <h3>Как складывается множитель</h3><p>Прибавки к количеству добычи от разных петов складываются. Копия предмета добавляет в среднем 18–28% предметов. Повторное открытие — это шанс получить ещё один такой же сундук. Компас умножает всё это сверху.</p>
      <h3>Компасы</h3><div class="tbl-wrap"><table class="wt"><tr><th>Компас</th><th class="r">Добыча</th><th class="r">Мобы бунта живучее</th></tr>${COMPASS.filter((c) => c.id !== 'none').map((c) => `<tr><td>${c.n} Shackles</td><td class="r">+${pct(c.q)}</td><td class="r">${c.hp > 1 ? `×${fmt(c.hp, 1)}` : '—'}</td></tr>`).join('')}</table></div>
      <p>Компас добавляет добычу только сундукам бунта и тратится при входе. Он окупается, если <b>прибавка × добыча без компаса</b> больше его цены. Пример: Redgold за 40 FE окупается, если сундуки бунта без компаса дают больше 50 FE (40 / 0,8). Укажите цены в настройках — помощник посчитает по вашим записям.</p>
      <p>Mercury и Redgold делают монстров бунта живучее. Неубитый узник не открывает сундук, поэтому берите их, только если билд успевает убить всех узников бунта, пока есть воскрешения.</p>`;
    },
    stats: () => {
      const c = totalCal(), d = C.DEFAULT_RULES, cr = calibratedRules();
      const prior = C.norm(d.tierW), nd = nSum(c.doors), ns = nSum(c.swaps);
      const tr = (label, arr, n) => `<tr><td>${label}</td>${[0, 1, 2, 3, 4].map((t) => `<td class="r num">${pct(arr[t], arr[t] < 0.1 ? 1 : 0)}</td>`).join('')}<td class="r num">${n}</td></tr>`;
      const toolRows = Object.entries(c.tools || {}).sort((p1, p2) => p2[1] - p1[1]).map(([id, k]) => `<tr><td>${TOOLS[id] ? TOOLS[id].n : id}</td><td class="r num">${k}</td><td class="r num">${pct(k / Math.max(1, c.offers))}</td></tr>`).join('');
      return `<h2>Ваша статистика</h2><p class="lead">Помощник учится на ваших забегах. Всё, что вы вводите, он заодно считает: кто вышел из дверей и замен, как часто встречается знак «!», какие инструменты предлагает игра и сколько их бывает за забег.</p>
      <h3>Почему один забег не ломает шансы</h3><p>Новые данные смешиваются с исходной оценкой так, будто она — это ${CAL_PRIOR.doors} уже виденных дверей. Пока ваших дверей мало, решает оценка; после ${CAL_PRIOR.doors} дверей ваши данные весят половину, после ${CAL_PRIOR.doors * 5} — уже 5/6. Так один «Обычный» не превращается в «100% Обычных».</p>
      <div class="tbl-wrap"><table class="wt"><tr><th></th><th class="r">Обычный</th><th class="r">Магический</th><th class="r">Редкий</th><th class="r">Легендарный</th><th class="r">Высший</th><th class="r">Ваших</th></tr>
      ${tr('Исходная оценка', prior, '—')}${tr('Дверь сейчас', C.norm(cr.tierW), nd)}${tr('Замена сейчас', C.norm(cr.swapW), ns)}</table></div>
      <p>Знак «!»: ${pct(cr.eventChance / 100, 1)} дверей (ваших патрулей: ${c.evN}, со знаком: ${c.evK}).</p>
      <h3>Инструментов за забег (этап ${curStage()})</h3><p>${cr.takes.map((p, i) => `${i + 1}: ${pct(p)}`).join(' · ')} — по ${nSum(c.takes || [])} вашим забегам на этом этапе, данным других этапов и исходной оценке.</p>
      ${stageTable()}
      ${toolRows ? `<h3>Предложения инструментов: ${c.offers}</h3><p class="note">Чем чаще инструмент предлагают, тем выше его вес в прогонах: так помощник учитывает, что одни инструменты встречаются реже других.</p><div class="tbl-wrap"><table class="wt"><tr><th>Инструмент</th><th class="r">Раз</th><th class="r">В предложениях</th></tr>${toolRows}</table></div>` : ''}
      <h3>Что подстраивается само</h3><p>Шансы дверей, замен и знака «!» пересчитываются после каждого вашего шага: на них сразу опираются советы, полоска «Кто за дверью» и прогоны. Цифры на карточках стратегий, ранги инструментов и таблица связок пересчитываются в фоне каждые ${RELAB_EVERY} записанных забегов — по вашим шансам дверей, «!» и числу инструментов. ${S.settings.labCache ? `Последний раз: ${new Date(S.settings.labCache.at).toLocaleDateString('ru-RU')}, этап ${S.settings.labCache.stage}.` : 'Пока используются заводские цифры.'} ${relab ? `Сейчас идёт пересчёт: ${relab.total - relab.left} из ${relab.total}.` : ''} Вручную обновлять нужно только сами правила игры, когда их меняет патч.</p>
      ${(() => { const fit = chestValues(); return fit ? `<h3>Цена сундука по вашим записям</h3><div class="tbl-wrap"><table class="wt"><tr>${TIERS.map((t) => `<th class="r">${t.n}</th>`).join('')}</tr><tr>${fit.v.map((v) => `<td class="r num">${fmt(v, 0)} FE</td>`).join('')}</tr></table></div><p class="note">По ${fit.n} записанным забегам, приведено к добыче без петов и компаса: каждая следующая редкость дороже примерно в ${fmt(fit.r, 2)} раза${fit.freeC ? '' : ', радужный пока оценён как полторы ступени сверху: радужных сундуков в записях меньше трёх'}. Используется стратегией «По моей добыче».</p>` : `<p>После ${FIT_MIN} записанных забегов здесь появится цена сундука каждой редкости в FE по вашей добыче, и откроется стратегия «По моей добыче».</p>`; })()}
      <h3>Добыча</h3><p>После бунта можно записать добычу из сундуков в FE. Из этого считаются средняя добыча за забег по этапам и окупаемость компаса. Время забега помощник не считает: между забегами бывают перерывы, и честно его не измерить. Сверхредкий дроп хранится в истории, но в средние не входит.</p>
      <h3>Тестовые забеги</h3><p>Если вы кликали наугад, чтобы опробовать помощника, сбросьте статистику («Сбросить» в разделе «Ваши забеги»): иначе выдуманные двери и инструменты будут влиять на шансы. Петы, компас и цены не сбрасываются.</p>
      <h3>Сохранить и перенести</h3><p>Всё хранится в этом браузере. Кнопки «Сохранить в файл» и «Загрузить из файла» в разделе «Ваши забеги» на главном экране переносят статистику между браузерами и защищают от очистки данных сайта.</p>`;
    },
    finds: () => {
      const gs = LAB.goalStats || {}, be = LAB.breakeven || [], rf = LAB.refresh || {};
      const v = gs.value, rbw = gs.rainbow, m = gs.mass;
      const beRows = be.map((x) => `<tr><td>×${fmt(x.ratio, 1)}</td><td class="r num">${signed(x.gain)}</td><td class="r num">${fmt(x.inmatesDevour, 1)}</td><td class="r num">${fmt(x.inmatesNever, 1)}</td></tr>`).join('');
      const rfLine = (g) => (rf[g] ? `${signed(rf[g][1] / rf[g][0] - 1)} за одно обновление, ${signed(rf[g][2] / rf[g][0] - 1)} за два` : '—');
      return `<h2>Находки</h2><p class="lead">Что показало моделирование. Каждую гипотезу проверяли на десятках тысяч забегов с одинаковыми случайностями, чтобы сравнение было честным.</p>
      <h3>1. Меняйте слабых узников</h3><p>Если не менять Магических, радуг за забег становится примерно на 40% меньше. Магический почти ничего не стоит, а замена — это новый шанс на Редкого и выше. Вырастить слабого через цепочки выходит дольше и реже, чем просто заменить.</p>
      <h3>2. Не откладывайте укусы</h3><p>Если копить узников и начинать есть только с 12-го дня, радуг на треть меньше. Стратегии «потерпеть, а потом сорвать куш» здесь нет: дни, когда укус не сделан, просто сгорают.</p>
      <h3>3. Двери: в первый день всё равно, дальше — дальняя</h3><p>В первый день все двери одинаковы, разница меньше 1%. Позже, когда все предложенные двери закрыты, дальняя даёт около +13% радуг: надзиратель быстрее обходит кольцо и чаще встаёт на известных узников.</p>
      <h3>4. События «!» решают много</h3><p>Если события за 2% дверей, а не за 10%, радуг около 18% меньше. Цепная реакция — самое ценное, что может прятаться за дверью. Отмечайте «!»: помощник уточнит, как часто они встречаются у вас.</p>
      <h3>5. Есть стоит, если следующая редкость заметно дороже</h3><p>Укус превращает двух узников в одного. Если сундук на ранг выше стоит меньше чем в ~1,6 раза дороже, лучше почти не есть. При удвоении поедание уже выгодно: цепочки доходят до радуг и даров.</p>
      <div class="tbl-wrap"><table class="wt"><tr><th>Ранг дороже в</th><th class="r">Выигрыш от поедания</th><th class="r">Узников к бунту</th><th class="r">Если не есть</th></tr>${beRows}</table></div>
      <h3>6. «Растить всех» почти не уступает охоте за радугами</h3><p>«Растить всех» даёт ${v ? fmt(v.rainbows, 2) : '—'} радуги за забег, «Охота за радугами» — ${rbw ? fmt(rbw.rainbows, 2) : '—'}. Разница мала, а сундуков больше. Поэтому она рекомендуется по умолчанию.</p>
      <h3>7. «Больше сундуков» — отдельная игра</h3><p>Она доводит до бунта ${m ? fmt(m.inmates + m.rainbows, 1) : '—'} сундуков против ${v ? fmt(v.inmates + v.rainbows, 1) : '—'}, но радуг втрое меньше.</p>
      <h3>8. Обновление инструментов у пета</h3><p>Для «Растить всех»: ${rfLine('value')}. Для «Охоты за радугами»: ${rfLine('rainbow')}.</p>
      <h3>9. Iron Tongs of Lust — один из лучших инструментов</h3><p>Если заходить к мамонту с бивнем и менять его, 4 узника растут на ранг. Помощник ведёт к таким мамонтам сам. Если в игре бивень остаётся на клетке после замены, это почти эксплойт: помощник спросит об этом после первой такой замены.</p>
      <h3>10. Отдельной «взрывной» стратегии нет</h3><p>Шанс собрать 2+ радуги за забег около 15% у любой сильной стратегии, и рискованный режим его не поднимает. Азарт живёт в точечных ставках по ходу забега.</p>`;
    },
    math: () => `<h2>Как мы считаем</h2><p class="lead">Короткая версия: точные формулы там, где их можно вывести, и честное моделирование там, где будущее слишком ветвится.</p>
      <h3>Точно, без моделирования</h3><ul>
      <li><b>Итог цепочки укусов</b> — полный перебор дерева вероятностей с запоминанием (динамическое программирование). Вид после каждого укуса равновероятен, цель выбирается случайно среди подходящих.</li>
      <li><b>Шанс увидеть сильный инструмент</b> — комбинаторика: 1 − C(N−k, 3) / C(N, 3) для одного предложения из 3 инструментов, со степенью для обновлений.</li>
      <li><b>Множитель добычи</b> — математическое ожидание: прибавки количества складываются, копия даёт 1 + p предметов, повторное открытие — 1 + p сундуков.</li></ul>
      <h3>Моделированием (Монте-Карло)</h3><p>Каждый вариант хода доигрывается до конца забега сотни раз. Всё, чего вы не видите — кто за дверями, куда пойдёт цепочка, — каждый раз разыгрывается заново. Дальнейшие ходы делает та же стратегия, что даёт советы.</p>
      <p>Варианты сравниваются <b>на одинаковых случайностях</b> (метод общих случайных чисел): у всех вариантов одни и те же двери и броски. Поэтому разница между ними видна уже на сотнях прогонов, а не на миллионах. Рядом с разницей помощник показывает её погрешность (два стандартных отклонения): если разница меньше погрешности, варианты равноценны (значок ≈).</p>
      <h3>Уточнение шансов по вашим забегам</h3><p>Байесовское сглаживание: исходная оценка считается заранее увиденными ${CAL_PRIOR.doors} дверями (распределение Дирихле), ваши наблюдения добавляются к ним. Итоговый шанс — среднее апостериорного распределения. Чем больше ваших данных, тем ближе шансы к вашей игре.</p>
      <h3>Ставка на радугу</h3><p>Радуга стоит больше своего сундука: дар хранилища и шанс на редкий дроп. Ставка предлагается, когда её цена в среднем меньше половины стоимости радужного сундука, умноженной на прирост шанса радуги, и прирост статистически надёжен.</p>
      <h3>Почему «настоящий» случай</h3><p>Признаков «подкрутки» (псевдослучайности с памятью) в этой механике нет, поэтому каждый бросок считается независимым. Если ваша статистика когда-нибудь заметно разойдётся с оценкой, это будет видно в разделе «Ваша статистика».</p>
      <h3>Что пока допущение</h3><ul><li>Шансы редкости за дверью: стартовая оценка 52 / 27 / 15 / 6% из фанатского симулятора, дальше — ваши данные.</li><li>Событие «!» за 10% дверей: симулятор предполагает 18%, доски, собранные до старта лиги, показывают меньше; надёжных данных пока нет.</li><li>Пищевая цепочка «одна еда на вид», как в видео-анонсе.</li><li>Ценность сундуков по редкости нигде не опубликована: стратегии задают её явно, «Свои цели» позволяют выбрать самому.</li></ul>
      <h3>Источники</h3><ul><li><a class="linkish" href="https://blahdot3h.github.io/tartarus-simulator/" target="_blank" rel="noopener">Tartarus Simulator</a> (CoffeeBns) и собранные им доски игроков (до старта лиги — слабые данные)</li><li><a class="linkish" href="https://tlidb.com/en/Twin_Inquisitors" target="_blank" rel="noopener">tlidb: Twin Inquisitors</a>, <a class="linkish" href="https://tlidb.com/en/Heartbloom_-_Iris" target="_blank" rel="noopener">Iris</a>, <a class="linkish" href="https://tlidb.com/en/Ripplepop_-_Taro" target="_blank" rel="noopener">Taro</a>, <a class="linkish" href="https://tlidb.com/en/Caged_Beast_Gameplay_Exclusive_Drops" target="_blank" rel="noopener">компасы</a></li><li><a class="linkish" href="https://news.17173.com/content/10102026/140115923.shtml" target="_blank" rel="noopener">Анонс сезона (17173)</a>, <a class="linkish" href="https://torchlight.xd.com/ss14pn/?lang=en" target="_blank" rel="noopener">патчноут SS14</a></li></ul>`,
  };

  // QA hook: lets a test harness load a position.
  window.__tartarus = { S, go, render, analyze, C, maybeRelab, LAB };

  // ---------- Boot ----------
  makeWorker();
  diskInit();
  adoptLabCache();
  setTimeout(maybeRelab, 4000);
  if (S.run) { S.run.s._rnd = rng; }
  render();
})();

</script>
