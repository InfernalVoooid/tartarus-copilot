name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Stamp build
        run: |
          BUILD="$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}"
          mkdir _site
          sed "s|<meta name=\"build\" content=\"dev\">|<meta name=\"build\" content=\"$BUILD\">|" index.html > _site/index.html
          grep -q "content=\"$BUILD\"" _site/index.html
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
